<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="rfArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(216,87,74,0.35)" />
      <stop offset="100%" stop-color="rgba(216,87,74,0.02)" />
    </linearGradient>
    <linearGradient id="lrArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(92,122,153,0.25)" />
      <stop offset="100%" stop-color="rgba(92,122,153,0.01)" />
    </linearGradient>

    <style>
      .axis-label { font-family: 'Inter', sans-serif; font-size: 12px; fill: #767E93; }
      .tick-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #767E93; }
      .chart-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; fill: #E6E9F0; }
      .chart-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #767E93; }
      @keyframes dashAnim {
        from { stroke-dashoffset: 800; }
        to { stroke-dashoffset: 0; }
      }
      .curve-rf {
        stroke-dasharray: 800;
        stroke-dashoffset: 0;
        animation: dashAnim 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite alternate;
      }
      .pulse-beacon {
        animation: beaconPulse 2s ease-in-out infinite;
      }
      @keyframes beaconPulse {
        0%, 100% { r: 6; opacity: 1; }
        50% { r: 12; opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="18" fill="#151A24" stroke="rgba(230,234,242,0.09)" stroke-width="1.5" />

  <!-- Header -->
  <text x="45" y="44" class="chart-title">ROC Curves — Benchmark Comparison</text>
  <text x="45" y="66" class="chart-sub">Receiver Operating Characteristic demonstrating exceptional ranking capability (Random Forest AUC 0.998 vs. Logistic Regression AUC 0.993).</text>

  <!-- Plot Area Frame (X: 100 to 700, Y: 110 to 410 -> 600x300 plot) -->
  <g transform="translate(100, 100)">
    <!-- Grid Lines -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="rgba(230,234,242,0.06)" />
    <line x1="0" y1="75" x2="600" y2="75" stroke="rgba(230,234,242,0.06)" />
    <line x1="0" y1="150" x2="600" y2="150" stroke="rgba(230,234,242,0.06)" />
    <line x1="0" y1="225" x2="600" y2="225" stroke="rgba(230,234,242,0.06)" />
    <line x1="0" y1="300" x2="600" y2="300" stroke="rgba(230,234,242,0.15)" />

    <line x1="0" y1="0" x2="0" y2="300" stroke="rgba(230,234,242,0.15)" />
    <line x1="150" y1="0" x2="150" y2="300" stroke="rgba(230,234,242,0.06)" />
    <line x1="300" y1="0" x2="300" y2="300" stroke="rgba(230,234,242,0.06)" />
    <line x1="450" y1="0" x2="450" y2="300" stroke="rgba(230,234,242,0.06)" />
    <line x1="600" y1="0" x2="600" y2="300" stroke="rgba(230,234,242,0.06)" />

    <!-- Y-Axis Labels (True Positive Rate) -->
    <text x="-12" y="5" class="tick-label" text-anchor="end">1.0</text>
    <text x="-12" y="80" class="tick-label" text-anchor="end">0.75</text>
    <text x="-12" y="155" class="tick-label" text-anchor="end">0.50</text>
    <text x="-12" y="230" class="tick-label" text-anchor="end">0.25</text>
    <text x="-12" y="305" class="tick-label" text-anchor="end">0.0</text>

    <!-- X-Axis Labels (False Positive Rate) -->
    <text x="0" y="322" class="tick-label" text-anchor="middle">0.0</text>
    <text x="150" y="322" class="tick-label" text-anchor="middle">0.25</text>
    <text x="300" y="322" class="tick-label" text-anchor="middle">0.50</text>
    <text x="450" y="322" class="tick-label" text-anchor="middle">0.75</text>
    <text x="600" y="322" class="tick-label" text-anchor="middle">1.0</text>

    <!-- Axis Titles -->
    <text x="300" y="348" class="axis-label" text-anchor="middle">False Positive Rate (1 - Specificity)</text>
    <text x="-150" y="-45" class="axis-label" text-anchor="middle" transform="rotate(-90)">True Positive Rate (Recall)</text>

    <!-- Diagonal Baseline: Random Guess (0.5 AUC) -->
    <line x1="0" y1="300" x2="600" y2="0" stroke="rgba(230,234,242,0.3)" stroke-width="1.5" stroke-dasharray="5 5" />

    <!-- Logistic Regression Curve (AUC = 0.993) -->
    <path d="M 0 300 Q 8 20, 26 12 T 80 5 T 600 0" fill="none" stroke="#5C7A99" stroke-width="2.5" opacity="0.85" />

    <!-- Random Forest Area Fill -->
    <path d="M 0 300 L 0 10 Q 5 2, 20 1 L 600 0 L 600 300 Z" fill="url(#rfArea)" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Random Forest Curve (AUC = 0.998) Animated -->
    <path d="M 0 300 L 0 10 Q 4 1, 15 0.5 L 600 0" fill="none" stroke="#D8574A" stroke-width="3.5" class="curve-rf" />

    <!-- Operating Point Indicator: RF Default Threshold (0.50) -->
    <g transform="translate(14, 70)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#D8574A" stroke-width="1.5" class="pulse-beacon" />
      <circle cx="0" cy="0" r="5" fill="#D8574A" />
      <line x1="0" y1="0" x2="60" y2="-30" stroke="#D8574A" stroke-width="1" />
      <rect x="60" y="-46" width="130" height="24" rx="5" fill="#0D1017" stroke="#D8574A" stroke-width="1" />
      <text x="68" y="-30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E6E9F0" font-weight="600">t=0.50 (RF Model)</text>
    </g>

    <!-- Operating Point Indicator: LR Default Threshold (0.50) -->
    <g transform="translate(42, 20)">
      <circle cx="0" cy="0" r="4.5" fill="#5C7A99" />
      <line x1="0" y1="0" x2="50" y2="40" stroke="#5C7A99" stroke-width="1" />
      <rect x="50" y="32" width="130" height="24" rx="5" fill="#0D1017" stroke="#5C7A99" stroke-width="1" />
      <text x="58" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E6E9F0" font-weight="600">t=0.50 (LR Model)</text>
    </g>
  </g>

  <!-- Legend & Card Readouts (Right Side) -->
  <g transform="translate(740, 110)">
    <!-- Legend Card 1: Random Forest -->
    <rect x="0" y="0" width="220" height="95" rx="10" fill="#0D1017" stroke="rgba(216,87,74,0.4)" stroke-width="1.5" />
    <circle cx="20" cy="24" r="5" fill="#D8574A" />
    <text x="34" y="28" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#E6E9F0">Random Forest</text>
    <text x="20" y="56" font-family="'Fraunces', serif" font-size="24" font-weight="700" fill="#D8574A">0.9982</text>
    <text x="115" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FA88F">AUC-ROC</text>
    <text x="20" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#767E93">Highest separation margin</text>

    <!-- Legend Card 2: Logistic Regression -->
    <rect x="0" y="115" width="220" height="95" rx="10" fill="#0D1017" stroke="rgba(92,122,153,0.4)" stroke-width="1.5" />
    <circle cx="20" cy="139" r="5" fill="#5C7A99" />
    <text x="34" y="143" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#E6E9F0">Logistic Regression</text>
    <text x="20" y="171" font-family="'Fraunces', serif" font-size="24" font-weight="700" fill="#5C7A99">0.9933</text>
    <text x="115" y="171" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FA88F">AUC-ROC</text>
    <text x="20" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#767E93">Linear log-odds ranking</text>

    <!-- Legend Card 3: Random Guess -->
    <rect x="0" y="230" width="220" height="70" rx="10" fill="#0D1017" stroke="rgba(230,234,242,0.08)" stroke-width="1" />
    <line x1="16" y1="250" x2="30" y2="250" stroke="rgba(230,234,242,0.4)" stroke-dasharray="3 3" stroke-width="2" />
    <text x="38" y="254" font-family="'Inter', sans-serif" font-size="12" fill="#767E93">Random Baseline</text>
    <text x="20" y="280" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#767E93">AUC: 0.5000</text>
  </g>
</svg>
