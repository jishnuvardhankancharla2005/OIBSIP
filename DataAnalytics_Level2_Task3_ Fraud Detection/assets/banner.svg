<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D" />
      <stop offset="50%" stop-color="#0D1017" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(216,87,74,0.4)" />
      <stop offset="60%" stop-color="rgba(216,87,74,0.06)" />
      <stop offset="100%" stop-color="rgba(216,87,74,0)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(230,234,242,0.04)" stroke-width="1" />
    </pattern>

    <!-- Dot Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(230,234,242,0.08)" />
    </pattern>

    <style>
      @keyframes radarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes scanVert {
        0% { y: 20px; opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { y: 360px; opacity: 0; }
      }
      .spin-group {
        transform-origin: 1040px 195px;
        animation: radarSpin 7s linear infinite;
      }
      .float-1 { animation: floatSlow 3.5s ease-in-out infinite; }
      .float-2 { animation: floatSlow 4.5s ease-in-out infinite 1s; }
      .float-3 { animation: floatSlow 4.0s ease-in-out infinite 0.5s; }
      .scan-beam { animation: scanVert 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.5" />

  <!-- Animated Ambient Lighting Cones -->
  <circle cx="1040" cy="195" r="170" fill="rgba(216,87,74,0.08)">
    <animate attributeName="r" values="140;180;140" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="180" cy="90" r="120" fill="rgba(79,168,143,0.06)">
    <animate attributeName="r" values="100;140;100" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Moving Laser Scanline -->
  <line x1="20" y1="50" x2="1180" y2="50" stroke="rgba(216,87,74,0.4)" stroke-width="1.5" stroke-dasharray="8 4">
    <animate attributeName="y1" values="25;365;25" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="25;365;25" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Outer Frame with Corner Accents -->
  <rect x="20" y="20" width="1160" height="350" rx="18" fill="none" stroke="rgba(230,234,242,0.12)" stroke-width="1.5" />
  <rect x="20" y="20" width="1160" height="350" rx="18" fill="none" stroke="rgba(216,87,74,0.3)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.15;0.65;0.15" dur="3s" repeatCount="indefinite" />
  </rect>

  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#D8574A" stroke-width="3" />
  <path d="M 1140 20 L 1180 20 L 1180 60" fill="none" stroke="#D8574A" stroke-width="3" />
  <path d="M 1180 330 L 1180 370 L 1140 370" fill="none" stroke="#D8574A" stroke-width="3" />
  <path d="M 60 370 L 20 370 L 20 330" fill="none" stroke="#D8574A" stroke-width="3" />

  <!-- ================= ANIMATED RADAR TELEMETRY (RIGHT) ================= -->
  <g id="radarStation">
    <!-- Concentric Target Circles -->
    <circle cx="1040" cy="195" r="140" fill="none" stroke="rgba(230,234,242,0.07)" stroke-width="1" />
    <circle cx="1040" cy="195" r="105" fill="none" stroke="rgba(230,234,242,0.11)" stroke-width="1" />
    <circle cx="1040" cy="195" r="70" fill="none" stroke="rgba(230,234,242,0.14)" stroke-width="1" />
    <circle cx="1040" cy="195" r="30" fill="none" stroke="rgba(216,87,74,0.35)" stroke-width="1.5" />

    <!-- Crosshairs -->
    <line x1="900" y1="195" x2="1180" y2="195" stroke="rgba(230,234,242,0.12)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="1040" y1="55" x2="1040" y2="335" stroke="rgba(230,234,242,0.12)" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Continuous Rotating Sweep (SMIL + CSS fallback) -->
    <g class="spin-group">
      <animateTransform attributeName="transform" type="rotate" from="0 1040 195" to="360 1040 195" dur="7s" repeatCount="indefinite" />
      <path d="M 1040 195 L 1180 195 A 140 140 0 0 1 1139 294 Z" fill="url(#sweepGrad)" />
      <line x1="1040" y1="195" x2="1180" y2="195" stroke="#D8574A" stroke-width="2" opacity="0.9" />
    </g>

    <!-- Pulsing Threat Target: Fraud Detected -->
    <g transform="translate(1095, 140)">
      <circle cx="0" cy="0" r="18" fill="rgba(216,87,74,0.2)">
        <animate attributeName="r" values="4;22;4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="6" fill="#D8574A" filter="url(#glowRed)">
        <animate attributeName="r" values="5;7;5" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#D8574A">FRAUD DETECTED</text>
      <text x="14" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#767E93">Score: 0.984 [ALERT]</text>
    </g>

    <!-- Legitimate Transaction Cleared -->
    <g transform="translate(980, 250)">
      <circle cx="0" cy="0" r="12" fill="rgba(79,168,143,0.15)">
        <animate attributeName="r" values="3;16;3" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="4.5" fill="#4FA88F" filter="url(#glowTeal)" />
      <text x="-70" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4FA88F">CLEARED (0.01)</text>
    </g>

    <!-- Ambient Suspicious Ping -->
    <g transform="translate(1005, 125)">
      <circle cx="0" cy="0" r="4" fill="#E0A33E">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="-64" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#E0A33E">FLAGGED_0.52</text>
    </g>
  </g>

  <!-- ================= HERO CONTENT (LEFT) ================= -->
  <!-- Header Tag Badge -->
  <g transform="translate(60, 68)">
    <rect x="0" y="0" width="232" height="26" rx="6" fill="rgba(216,87,74,0.12)" stroke="rgba(216,87,74,0.4)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#D8574A">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#E6E9F0" letter-spacing="0.5">MACHINE LEARNING DEFENSE</text>
  </g>

  <!-- Title & Branding -->
  <text x="60" y="142" font-family="'Fraunces', serif, 'Georgia'" font-size="44" font-weight="600" fill="#E6E9F0" letter-spacing="-0.5">
    The Fraud <tspan fill="#D8574A">Desk</tspan>
  </text>
  <text x="325" y="142" font-family="'Inter', sans-serif" font-size="28" font-weight="300" fill="#767E93">
    — Risk Intelligence
  </text>

  <!-- Subtitle Narrative -->
  <text x="60" y="180" font-family="'Inter', sans-serif" font-size="14.5" fill="#AEB4C4">
    Uncovering <tspan fill="#E6E9F0" font-weight="600">151 critical fraud vectors</tspan> hidden inside 10,000 banking transactions.
  </text>
  <text x="60" y="202" font-family="'Inter', sans-serif" font-size="13.5" fill="#767E93">
    SMOTE-balanced dual classifiers · Dynamic cost-sensitive thresholding · Client-side live risk inference.
  </text>

  <!-- ================= TELEMETRY STAT CARDS ================= -->
  <g transform="translate(60, 238)">
    <!-- Card 1: Peak ROC-AUC -->
    <g class="float-1">
      <rect x="0" y="0" width="165" height="66" rx="12" fill="rgba(21,26,36,0.92)" stroke="rgba(230,234,242,0.12)" stroke-width="1" />
      <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#767E93" letter-spacing="0.5">PEAK ROC-AUC</text>
      <text x="18" y="52" font-family="'Fraunces', serif" font-size="25" font-weight="600" fill="#4FA88F">0.998</text>
      <text x="100" y="52" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#4FA88F">RF Model</text>
      <circle cx="148" cy="20" r="3" fill="#4FA88F">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Card 2: Fraud Recall -->
    <g transform="translate(180, 0)" class="float-2">
      <rect x="0" y="0" width="165" height="66" rx="12" fill="rgba(21,26,36,0.92)" stroke="rgba(230,234,242,0.12)" stroke-width="1" />
      <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#767E93" letter-spacing="0.5">FRAUD RECALL</text>
      <text x="18" y="52" font-family="'Fraunces', serif" font-size="25" font-weight="600" fill="#D8574A">93.3%</text>
      <text x="98" y="52" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#D8574A">28/30 Caught</text>
      <circle cx="148" cy="20" r="3" fill="#D8574A">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Card 3: Top Risk Signal -->
    <g transform="translate(360, 0)" class="float-3">
      <rect x="0" y="0" width="185" height="66" rx="12" fill="rgba(21,26,36,0.92)" stroke="rgba(230,234,242,0.12)" stroke-width="1" />
      <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#767E93" letter-spacing="0.5">TOP RISK SIGNAL</text>
      <text x="18" y="51" font-family="'JetBrains Mono', monospace" font-size="15.5" font-weight="600" fill="#E0A33E">device_trust</text>
      <text x="145" y="51" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E0A33E">24.2%</text>
    </g>

    <!-- Card 4: Client-side Engine -->
    <g transform="translate(560, 0)" class="float-1">
      <rect x="0" y="0" width="180" height="66" rx="12" fill="rgba(21,26,36,0.92)" stroke="rgba(230,234,242,0.12)" stroke-width="1" />
      <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#767E93" letter-spacing="0.5">LIVE INFERENCE</text>
      <text x="18" y="52" font-family="'Fraunces', serif" font-size="21" font-weight="500" fill="#E6E9F0">Client-Side</text>
      <text x="124" y="52" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#4FA88F">Zero-API</text>
    </g>
  </g>

  <!-- Bottom Telemetry Line -->
  <g transform="translate(60, 338)">
    <circle cx="5" cy="5" r="3" fill="#4FA88F">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="9" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#767E93">SMOTE ISOLATED · COST-SENSITIVE SWEEP · TOP 5 PREDICTIVE DRIVERS · RESILIENT ARCHITECTURE</text>
  </g>
</svg>
