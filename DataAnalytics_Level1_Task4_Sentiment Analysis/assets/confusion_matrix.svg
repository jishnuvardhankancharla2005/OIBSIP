<svg fill="none" viewBox="0 0 900 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .cm-card {
          background: #0d0c1d;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          width: 900px;
          height: 360px;
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
          box-sizing: border-box;
          padding: 22px 28px;
          position: relative;
          overflow: hidden;
          display: flex;
          gap: 28px;
        }

        .bg-grid {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(147, 51, 234, 0.08) 1px, transparent 1px);
          background-size: 16px 16px;
          pointer-events: none;
        }

        /* Left Side: Matrix */
        .matrix-section {
          flex: 1.2;
          display: flex;
          flex-direction: column;
          position: relative;
          z-index: 2;
        }

        .card-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 14px;
        }

        .card-title {
          font-size: 14px;
          font-weight: 700;
          color: #f8fafc;
          display: flex;
          align-items: center;
          gap: 8px;
          letter-spacing: 0.5px;
        }

        .badge-live {
          font-size: 10px;
          font-weight: 700;
          padding: 3px 8px;
          border-radius: 12px;
          background: rgba(158, 134, 217, 0.15);
          color: #c4b5fd;
          border: 1px solid rgba(158, 134, 217, 0.3);
          text-transform: uppercase;
          letter-spacing: 0.8px;
        }

        .matrix-grid {
          display: grid;
          grid-template-columns: 70px repeat(3, 1fr);
          gap: 6px;
          align-items: center;
        }

        .cm-label {
          font-size: 11px;
          font-weight: 600;
          color: #94a3b8;
          text-align: center;
        }

        .cm-label.row {
          text-align: right;
          padding-right: 8px;
        }

        .cm-cell {
          height: 60px;
          border-radius: 8px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-size: 16px;
          font-weight: 700;
          border: 1px solid rgba(255, 255, 255, 0.06);
          position: relative;
          overflow: hidden;
          transition: transform 0.3s ease;
        }

        .cm-cell .sub {
          font-size: 9px;
          font-weight: 500;
          opacity: 0.8;
          margin-top: 2px;
        }

        /* Diagonal correct predictions */
        .cm-cell.diag-neg {
          background: rgba(227, 123, 107, 0.25);
          color: #fca5a5;
          border-color: rgba(227, 123, 107, 0.4);
          animation: glowNeg 3s infinite alternate ease-in-out;
        }

        .cm-cell.diag-neu {
          background: rgba(232, 182, 90, 0.25);
          color: #fde047;
          border-color: rgba(232, 182, 90, 0.4);
          animation: glowNeu 3s infinite alternate ease-in-out 0.8s;
        }

        .cm-cell.diag-pos {
          background: rgba(95, 199, 160, 0.25);
          color: #86efac;
          border-color: rgba(95, 199, 160, 0.4);
          animation: glowPos 3s infinite alternate ease-in-out 1.6s;
        }

        .cm-cell.off {
          background: rgba(255, 255, 255, 0.03);
          color: #64748b;
        }

        @keyframes glowNeg {
          0% { box-shadow: 0 0 5px rgba(227, 123, 107, 0.2); }
          100% { box-shadow: 0 0 18px rgba(227, 123, 107, 0.5); }
        }
        @keyframes glowNeu {
          0% { box-shadow: 0 0 5px rgba(232, 182, 90, 0.2); }
          100% { box-shadow: 0 0 18px rgba(232, 182, 90, 0.5); }
        }
        @keyframes glowPos {
          0% { box-shadow: 0 0 5px rgba(95, 199, 160, 0.2); }
          100% { box-shadow: 0 0 18px rgba(95, 199, 160, 0.5); }
        }

        /* Right Side: Performance Summary */
        .summary-section {
          flex: 1;
          background: rgba(26, 23, 41, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          padding: 16px 18px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          position: relative;
          z-index: 2;
          backdrop-filter: blur(10px);
        }

        .summary-title {
          font-size: 13px;
          font-weight: 700;
          color: #e2e8f0;
          margin-bottom: 12px;
        }

        .metric-bar-group {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .metric-item {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .metric-header {
          display: flex;
          justify-content: space-between;
          font-size: 11px;
          font-weight: 600;
          color: #cbd5e1;
        }

        .progress-track {
          height: 7px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 4px;
          overflow: hidden;
          position: relative;
        }

        .progress-fill {
          height: 100%;
          border-radius: 4px;
          animation: fillProgress 2s ease-out forwards;
        }

        .fill-pos { background: linear-gradient(90deg, #10b981, #34d399); width: 75.3%; }
        .fill-neg { background: linear-gradient(90deg, #ef4444, #f87171); width: 69.3%; }
        .fill-neu { background: linear-gradient(90deg, #f59e0b, #fbbf24); width: 60.6%; }
        .fill-overall { background: linear-gradient(90deg, #8b5cf6, #c084fc); width: 68.4%; }

        @keyframes fillProgress {
          from { width: 0%; }
        }

        .callout-box {
          background: rgba(139, 92, 246, 0.1);
          border-left: 3px solid #a855f7;
          border-radius: 0 6px 6px 0;
          padding: 8px 10px;
          font-size: 10.5px;
          color: #cbd5e1;
          line-height: 1.4;
          margin-top: 10px;
        }
      </style>
      
      <div class="cm-card">
        <div class="bg-grid"></div>

        <!-- Left Column -->
        <div class="matrix-section">
          <div class="card-header">
            <div class="card-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
              Logistic Regression Confusion Matrix
            </div>
            <div class="badge-live">Test (N=3,600)</div>
          </div>

          <div class="matrix-grid">
            <!-- Col Headers -->
            <div></div>
            <div class="cm-label">Pred Neg</div>
            <div class="cm-label">Pred Neu</div>
            <div class="cm-label">Pred Pos</div>

            <!-- Row 1: Actual Neg -->
            <div class="cm-label row">Act Neg</div>
            <div class="cm-cell diag-neg">828<span class="sub">69.0%</span></div>
            <div class="cm-cell off">275<span class="sub">22.9%</span></div>
            <div class="cm-cell off">97<span class="sub">8.1%</span></div>

            <!-- Row 2: Actual Neu -->
            <div class="cm-label row">Act Neu</div>
            <div class="cm-cell off">264<span class="sub">22.0%</span></div>
            <div class="cm-cell diag-neu">725<span class="sub">60.4%</span></div>
            <div class="cm-cell off">211<span class="sub">17.6%</span></div>

            <!-- Row 3: Actual Pos -->
            <div class="cm-label row">Act Pos</div>
            <div class="cm-cell off">97<span class="sub">8.1%</span></div>
            <div class="cm-cell off">192<span class="sub">16.0%</span></div>
            <div class="cm-cell diag-pos">911<span class="sub">75.9%</span></div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="summary-section">
          <div class="summary-title">Class Performance &amp; F1-Score</div>
          
          <div class="metric-bar-group">
            <div class="metric-item">
              <div class="metric-header">
                <span>Positive Class (4–5★)</span>
                <span style="color:#34d399">75.3% F1</span>
              </div>
              <div class="progress-track"><div class="progress-fill fill-pos"></div></div>
            </div>

            <div class="metric-item">
              <div class="metric-header">
                <span>Negative Class (1–2★)</span>
                <span style="color:#f87171">69.3% F1</span>
              </div>
              <div class="progress-track"><div class="progress-fill fill-neg"></div></div>
            </div>

            <div class="metric-item">
              <div class="metric-header">
                <span>Neutral Class (3★)</span>
                <span style="color:#fbbf24">60.6% F1</span>
              </div>
              <div class="progress-track"><div class="progress-fill fill-neu"></div></div>
            </div>

            <div class="metric-item">
              <div class="metric-header">
                <span>Overall Accuracy</span>
                <span style="color:#c084fc">68.44%</span>
              </div>
              <div class="progress-track"><div class="progress-fill fill-overall"></div></div>
            </div>
          </div>

          <div class="callout-box">
            <strong>Key takeaway:</strong> Extreme cross-boundary errors (Neg ↔ Pos) occur in only <strong>8.1%</strong> of cases. The majority of classification errors reside in adjacent neutral boundaries.
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
