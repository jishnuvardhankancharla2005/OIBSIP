<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #09090b 100%);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          width: 900px;
          height: 240px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          border-radius: 16px;
          border: 1px solid rgba(139, 92, 246, 0.3);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(139, 92, 246, 0.2);
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
          padding: 20px;
        }

        /* Animated Glowing Grid Background */
        .grid {
          position: absolute;
          width: 200%;
          height: 200%;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 30px 30px;
          transform: perspective(500px) rotateX(60deg) translateY(-80px) translateZ(0);
          animation: gridMove 12s linear infinite;
        }

        @keyframes gridMove {
          0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(0); }
          100% { transform: perspective(500px) rotateX(60deg) translateY(60px) translateZ(0); }
        }

        /* Ambient Glow Orbs */
        .glow-orb-1 {
          position: absolute;
          width: 320px;
          height: 320px;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, transparent 70%);
          top: -120px;
          left: 50px;
          filter: blur(40px);
          animation: pulseOrb 6s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
          position: absolute;
          width: 280px;
          height: 280px;
          background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
          bottom: -100px;
          right: 80px;
          filter: blur(40px);
          animation: pulseOrb 7s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseOrb {
          0% { transform: scale(0.9) translate(0, 0); opacity: 0.6; }
          100% { transform: scale(1.2) translate(20px, 10px); opacity: 1; }
        }

        /* Badge */
        .badge {
          position: relative;
          z-index: 10;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 14px;
          background: rgba(139, 92, 246, 0.15);
          border: 1px solid rgba(167, 139, 250, 0.4);
          border-radius: 9999px;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          color: #c4b5fd;
          margin-bottom: 12px;
          backdrop-filter: blur(8px);
        }

        .pulse-dot {
          width: 7px;
          height: 7px;
          background: #10b981;
          border-radius: 50%;
          box-shadow: 0 0 10px #10b981;
          animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.3; transform: scale(0.7); }
        }

        /* Title with shimmering gradient */
        .title {
          position: relative;
          z-index: 10;
          font-size: 34px;
          font-weight: 800;
          margin: 0;
          text-align: center;
          background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 30%, #a78bfa 70%, #38bdf8 100%);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shine 5s linear infinite;
          letter-spacing: -0.5px;
        }

        @keyframes shine {
          to { background-position: 200% center; }
        }

        /* Subtitle */
        .subtitle {
          position: relative;
          z-index: 10;
          font-size: 14px;
          color: #94a3b8;
          margin: 8px 0 18px 0;
          text-align: center;
          max-width: 620px;
          line-height: 1.4;
        }

        /* Metric Highlights */
        .tags {
          position: relative;
          z-index: 10;
          display: flex;
          gap: 12px;
        }

        .tag {
          font-size: 11.5px;
          font-weight: 600;
          padding: 4px 12px;
          border-radius: 6px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #cbd5e1;
        }

        .tag.neg { color: #f87171; border-color: rgba(248, 113, 113, 0.3); background: rgba(239, 68, 68, 0.1); }
        .tag.neu { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); background: rgba(245, 158, 11, 0.1); }
        .tag.pos { color: #34d399; border-color: rgba(52, 211, 153, 0.3); background: rgba(16, 185, 129, 0.1); }
      </style>
      
      <div class="container">
        <div class="grid"></div>
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        
        <div class="badge">
          <span class="pulse-dot"></span>
          Level 1 · Task 4 · Oasis Infobyte Data Analytics
        </div>
        
        <h1 class="title">Sentiment Analysis &amp; NLP Intelligence Lab</h1>
        
        <p class="subtitle">
          Multinomial Naive Bayes vs. Logistic Regression on 18,000 Class-Balanced Reviews with Interactive Visual Analytics
        </p>

        <div class="tags">
          <span class="tag neg">● Negative (1–2★)</span>
          <span class="tag neu">● Neutral (3★)</span>
          <span class="tag pos">● Positive (4–5★)</span>
          <span class="tag">TF-IDF N-Grams</span>
          <span class="tag">Zero-Dependency Dashboard</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
