<svg fill="none" viewBox="0 0 900 380" width="100%" height="380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .arch-container {
          background: #0d0c1d;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          width: 900px;
          height: 380px;
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
          box-sizing: border-box;
          padding: 24px 28px;
          position: relative;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }

        .bg-lines {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(147, 51, 234, 0.12) 1px, transparent 1px);
          background-size: 20px 20px;
          pointer-events: none;
        }

        .header-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: relative;
          z-index: 2;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          padding-bottom: 12px;
        }

        .header-title {
          font-size: 15px;
          font-weight: 700;
          color: #f1f5f9;
          display: flex;
          align-items: center;
          gap: 10px;
          letter-spacing: 0.5px;
        }

        .status-pill {
          font-size: 11px;
          font-weight: 600;
          padding: 3px 10px;
          border-radius: 20px;
          background: rgba(16, 185, 129, 0.15);
          color: #34d399;
          border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pipeline-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
          position: relative;
          z-index: 2;
          margin-top: 14px;
        }

        .stage-card {
          background: rgba(26, 23, 41, 0.85);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          padding: 16px 14px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          backdrop-filter: blur(10px);
          position: relative;
          transition: border-color 0.3s ease;
        }

        .stage-card:hover {
          border-color: rgba(168, 85, 247, 0.5);
        }

        .stage-num {
          font-size: 10px;
          font-weight: 800;
          letter-spacing: 1px;
          color: #a855f7;
          text-transform: uppercase;
        }

        .stage-name {
          font-size: 14px;
          font-weight: 700;
          color: #f8fafc;
          margin: 0;
        }

        .stage-items {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .stage-item {
          font-size: 11px;
          color: #94a3b8;
          display: flex;
          align-items: center;
          gap: 6px;
          line-height: 1.3;
        }

        .stage-item::before {
          content: "▹";
          color: #818cf8;
          font-size: 10px;
        }

        .badge-sub {
          margin-top: auto;
          font-size: 10px;
          padding: 3px 6px;
          background: rgba(255, 255, 255, 0.04);
          border-radius: 4px;
          color: #cbd5e1;
          text-align: center;
          font-weight: 500;
          border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Connecting Flow Arrows / Pulsing Glow */
        .flow-bar {
          height: 3px;
          background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6, #10b981);
          border-radius: 2px;
          position: relative;
          margin-top: 14px;
          overflow: hidden;
        }

        .flow-pulse {
          position: absolute;
          top: 0;
          left: -100px;
          width: 80px;
          height: 100%;
          background: #ffffff;
          box-shadow: 0 0 12px #ffffff;
          animation: flowAnim 2.8s infinite ease-in-out;
        }

        @keyframes flowAnim {
          0% { left: -80px; }
          100% { left: 920px; }
        }

        .footer-note {
          display: flex;
          justify-content: space-between;
          font-size: 11px;
          color: #64748b;
          margin-top: 10px;
          position: relative;
          z-index: 2;
        }
      </style>
      
      <div class="arch-container">
        <div class="bg-lines"></div>

        <div class="header-bar">
          <div class="header-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            SYSTEM ARCHITECTURE &amp; DATA PROCESSING PIPELINE
          </div>
          <div class="status-pill">● End-to-End NLP Flow</div>
        </div>

        <div class="pipeline-grid">
          <!-- Step 1 -->
          <div class="stage-card">
            <span class="stage-num">STAGE 01</span>
            <h4 class="stage-name">Data Ingestion</h4>
            <ul class="stage-items">
              <li class="stage-item">568,454 Raw Amazon Reviews</li>
              <li class="stage-item">Label Mapping (1-2★, 3★, 4-5★)</li>
              <li class="stage-item">Class-Balanced Sampling (18K)</li>
              <li class="stage-item">Train/Test Split (80 / 20)</li>
            </ul>
            <div class="badge-sub">6,000 / class sample</div>
          </div>

          <!-- Step 2 -->
          <div class="stage-card">
            <span class="stage-num">STAGE 02</span>
            <h4 class="stage-name">NLP Preprocessing</h4>
            <ul class="stage-items">
              <li class="stage-item">HTML Tag &amp; URL Removal</li>
              <li class="stage-item">Punctuation &amp; Number Stripping</li>
              <li class="stage-item">Lowercase Normalization</li>
              <li class="stage-item">TF-IDF (1-2 Grams, 5K Vocab)</li>
            </ul>
            <div class="badge-sub">NLTK + Scikit-Learn</div>
          </div>

          <!-- Step 3 -->
          <div class="stage-card">
            <span class="stage-num">STAGE 03</span>
            <h4 class="stage-name">Model Training</h4>
            <ul class="stage-items">
              <li class="stage-item">Multinomial Naive Bayes</li>
              <li class="stage-item">Logistic Regression (L2)</li>
              <li class="stage-item">Confusion Matrix Profiling</li>
              <li class="stage-item">Feature Weight Extraction</li>
            </ul>
            <div class="badge-sub">68.4% Accuracy / 0.684 F1</div>
          </div>

          <!-- Step 4 -->
          <div class="stage-card">
            <span class="stage-num">STAGE 04</span>
            <h4 class="stage-name">Interactive BI UI</h4>
            <ul class="stage-items">
              <li class="stage-item">Zero-Dependency Dashboard</li>
              <li class="stage-item">Real-Time Prediction Explorer</li>
              <li class="stage-item">Confusion Matrix Heatmaps</li>
              <li class="stage-item">Vocabulary Word Clouds</li>
            </ul>
            <div class="badge-sub">Chart.js + Native Vanilla UI</div>
          </div>
        </div>

        <div class="flow-bar">
          <div class="flow-pulse"></div>
        </div>

        <div class="footer-note">
          <span>⚡ Raw Ingestion ➔ Feature Space ➔ Statistical Classification ➔ Real-Time Exploration</span>
          <span>Amazon Fine Food Reviews (568K Dataset)</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
