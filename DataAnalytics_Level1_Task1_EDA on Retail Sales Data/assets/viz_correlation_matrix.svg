<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="50%" stop-color="#111B2C"/>
      <stop offset="100%" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2538"/>
      <stop offset="100%" stop-color="#121B2A"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowCell" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; fill: #F8FAFC; }
      .sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #94A3B8; font-size: 13px; }
      .label { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #64748B; font-size: 11px; }
      .val { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 600; fill: #F1F5F9; font-size: 13px; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      .heat-val { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 12.5px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="420" rx="18" fill="url(#bgGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(36, 30)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="rgba(79,168,143,0.15)" stroke="#4FA88F" stroke-width="1"/>
    <!-- Grid icon -->
    <path d="M9 9 H14 V14 H9 Z M18 9 H23 V14 H18 Z M9 18 H14 V23 H9 Z M18 18 H23 V23 H18 Z" fill="#4FA88F"/>
    <text x="44" y="16" class="title" font-size="18">Correlation &amp; Demographic Anomaly Heatmaps</text>
    <text x="44" y="32" class="sub">Statistical Feature Dependencies &amp; High-AOV Cohort Intersections</text>
    
    <!-- Insight Pill -->
    <rect x="740" y="2" width="188" height="26" rx="13" fill="rgba(227,168,87,0.12)" stroke="#E3A857" stroke-width="1"/>
    <text x="834" y="19" class="title" font-size="11" fill="#FCD34D" text-anchor="middle">PRICE DRIVES 85% REVENUE</text>
  </g>

  <!-- Left Card: Pearson Correlation Matrix -->
  <g transform="translate(36, 80)" filter="url(#shadow2)">
    <rect width="455" height="310" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="24" y="28" class="title" font-size="14">Pearson Correlation Matrix (r)</text>
    <text x="24" y="44" class="label">Zero linkage with Age; strong linkage with Unit Price</text>

    <!-- Matrix Table -->
    <g transform="translate(85, 75)">
      <!-- Column Headers -->
      <text x="42" y="-12" class="mono label" text-anchor="middle">Age</text>
      <text x="124" y="-12" class="mono label" text-anchor="middle">Quantity</text>
      <text x="206" y="-12" class="mono label" text-anchor="middle">Price/Unit</text>
      <text x="288" y="-12" class="mono label" text-anchor="middle">Total $</text>

      <!-- Row Headers -->
      <text x="-12" y="22" class="mono label" text-anchor="end">Age</text>
      <text x="-12" y="66" class="mono label" text-anchor="end">Quantity</text>
      <text x="-12" y="110" class="mono label" text-anchor="end">Price/Unit</text>
      <text x="-12" y="154" class="mono label" text-anchor="end">Total $</text>

      <!-- Row 1: Age -->
      <g transform="translate(0, 0)">
        <rect x="5" y="5" width="74" height="36" rx="6" fill="#1E3A8A"/>
        <text x="42" y="23" class="heat-val" fill="#93C5FD">1.000</text>

        <rect x="87" y="5" width="74" height="36" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="124" y="23" class="heat-val" fill="#94A3B8">-0.024</text>

        <rect x="169" y="5" width="74" height="36" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="206" y="23" class="heat-val" fill="#94A3B8">-0.038</text>

        <rect x="251" y="5" width="74" height="36" rx="6" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)"/>
        <text x="288" y="23" class="heat-val" fill="#FCA5A5">-0.061</text>
      </g>

      <!-- Row 2: Quantity -->
      <g transform="translate(0, 44)">
        <rect x="5" y="5" width="74" height="36" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="42" y="23" class="heat-val" fill="#94A3B8">-0.024</text>

        <rect x="87" y="5" width="74" height="36" rx="6" fill="#1E3A8A"/>
        <text x="124" y="23" class="heat-val" fill="#93C5FD">1.000</text>

        <rect x="169" y="5" width="74" height="36" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="206" y="23" class="heat-val" fill="#94A3B8">+0.008</text>

        <rect x="251" y="5" width="74" height="36" rx="6" fill="rgba(16,185,129,0.25)" stroke="#10B981"/>
        <text x="288" y="23" class="heat-val" fill="#6EE7B7">+0.374</text>
      </g>

      <!-- Row 3: Price/Unit -->
      <g transform="translate(0, 88)">
        <rect x="5" y="5" width="74" height="36" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="42" y="23" class="heat-val" fill="#94A3B8">-0.038</text>

        <rect x="87" y="5" width="74" height="36" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="124" y="23" class="heat-val" fill="#94A3B8">+0.008</text>

        <rect x="169" y="5" width="74" height="36" rx="6" fill="#1E3A8A"/>
        <text x="206" y="23" class="heat-val" fill="#93C5FD">1.000</text>

        <rect x="251" y="5" width="74" height="36" rx="6" fill="rgba(227,168,87,0.35)" stroke="#E3A857" stroke-width="1.5" filter="url(#glowCell)"/>
        <text x="288" y="23" class="heat-val" fill="#FDE68A">+0.852</text>
      </g>

      <!-- Row 4: Total Amount -->
      <g transform="translate(0, 132)">
        <rect x="5" y="5" width="74" height="36" rx="6" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)"/>
        <text x="42" y="23" class="heat-val" fill="#FCA5A5">-0.061</text>

        <rect x="87" y="5" width="74" height="36" rx="6" fill="rgba(16,185,129,0.25)" stroke="#10B981"/>
        <text x="124" y="23" class="heat-val" fill="#6EE7B7">+0.374</text>

        <rect x="169" y="5" width="74" height="36" rx="6" fill="rgba(227,168,87,0.35)" stroke="#E3A857" stroke-width="1.5" filter="url(#glowCell)"/>
        <text x="206" y="23" class="heat-val" fill="#FDE68A">+0.852</text>

        <rect x="251" y="5" width="74" height="36" rx="6" fill="#1E3A8A"/>
        <text x="288" y="23" class="heat-val" fill="#93C5FD">1.000</text>
      </g>
    </g>

    <!-- Matrix Footnote -->
    <text x="24" y="288" class="label" fill="#A855F7">★ Key Insight: Age is orthogonal to spend. Merchandising price tier dominates gross revenue.</text>
  </g>

  <!-- Right Card: Demographic vs Category AOV Cohort Matrix -->
  <g transform="translate(509, 80)" filter="url(#shadow2)">
    <rect width="455" height="310" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="24" y="28" class="title" font-size="14">Age Cohort × Category Spend Matrix (Avg $)</text>
    <text x="24" y="44" class="label">Hidden micro-segmentation reveals outsized Electronics spend</text>

    <!-- Matrix Grid -->
    <g transform="translate(90, 75)">
      <!-- Columns -->
      <text x="50" y="-12" class="mono label" text-anchor="middle">Beauty</text>
      <text x="160" y="-12" class="mono label" text-anchor="middle">Clothing</text>
      <text x="270" y="-12" class="mono label" text-anchor="middle">Electronics</text>

      <!-- Rows -->
      <!-- 18-25 -->
      <g transform="translate(0, 0)">
        <text x="-15" y="20" class="mono label" text-anchor="end">18–25</text>
        <rect x="5" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="50" y="16" class="heat-val" fill="#E2E8F0">$442</text>

        <rect x="115" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="160" y="16" class="heat-val" fill="#E2E8F0">$439</text>

        <rect x="225" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="270" y="16" class="heat-val" fill="#E2E8F0">$451</text>
      </g>

      <!-- 26-35 -->
      <g transform="translate(0, 34)">
        <text x="-15" y="20" class="mono label" text-anchor="end">26–35</text>
        <rect x="5" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="50" y="16" class="heat-val" fill="#E2E8F0">$458</text>

        <rect x="115" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="160" y="16" class="heat-val" fill="#E2E8F0">$461</text>

        <rect x="225" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="270" y="16" class="heat-val" fill="#E2E8F0">$448</text>
      </g>

      <!-- 36-45 -->
      <g transform="translate(0, 68)">
        <text x="-15" y="20" class="mono label" text-anchor="end">36–45</text>
        <rect x="5" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="50" y="16" class="heat-val" fill="#E2E8F0">$431</text>

        <rect x="115" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="160" y="16" class="heat-val" fill="#E2E8F0">$447</text>

        <rect x="225" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="270" y="16" class="heat-val" fill="#E2E8F0">$472</text>
      </g>

      <!-- 46-55 (HIGH VALUE CALLOUT) -->
      <g transform="translate(0, 102)">
        <text x="-15" y="20" class="mono label" text-anchor="end" font-weight="700" fill="#FCD34D">46–55</text>
        <rect x="5" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="50" y="16" class="heat-val" fill="#E2E8F0">$455</text>

        <rect x="115" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="160" y="16" class="heat-val" fill="#E2E8F0">$438</text>

        <!-- Golden Highlight Cell -->
        <rect x="225" y="2" width="90" height="28" rx="6" fill="rgba(227,168,87,0.3)" stroke="#E3A857" stroke-width="1.6" filter="url(#glowCell)"/>
        <text x="270" y="16" class="heat-val" fill="#FDE68A">$524 ★</text>
      </g>

      <!-- 56-64 -->
      <g transform="translate(0, 136)">
        <text x="-15" y="20" class="mono label" text-anchor="end">56–64</text>
        <rect x="5" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="50" y="16" class="heat-val" fill="#E2E8F0">$439</text>

        <rect x="115" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="160" y="16" class="heat-val" fill="#E2E8F0">$452</text>

        <rect x="225" y="2" width="90" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="270" y="16" class="heat-val" fill="#E2E8F0">$460</text>
      </g>
    </g>

    <!-- Anomaly Callout Box -->
    <g transform="translate(24, 252)">
      <rect width="407" height="42" rx="8" fill="rgba(227,168,87,0.08)" stroke="rgba(227,168,87,0.25)"/>
      <text x="14" y="18" class="val" font-size="11.5" fill="#FCD34D">🎯 Top Opportunity: 46–55 Cohort + Electronics ($524 AOV)</text>
      <text x="14" y="32" class="label" font-size="10.5">Yields +15% premium over general customer average ($456).</text>
    </g>
  </g>
</svg>
