<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="50%" stop-color="#111B2C"/>
      <stop offset="100%" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2538"/>
      <stop offset="100%" stop-color="#121B2A"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3A857" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E3A857" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3A857"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; fill: #F8FAFC; }
      .sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #94A3B8; font-size: 13px; }
      .label { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #64748B; font-size: 11px; }
      .val { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 600; fill: #F1F5F9; font-size: 13px; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      
      @keyframes pulseDot {
        0%, 100% { r: 5px; opacity: 1; }
        50% { r: 8px; opacity: 0.6; }
      }
      .peak-pulse { animation: pulseDot 2.2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="460" rx="18" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="rgba(227,168,87,0.15)" stroke="#E3A857" stroke-width="1"/>
    <path d="M7 23 L13 15 L18 19 L25 9" fill="none" stroke="#E3A857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="16" class="title" font-size="18">Retail Sales Revenue &amp; Category Dynamics</text>
    <text x="44" y="32" class="sub">1,000 Transactions Longitudinal Analysis · Peak $43.1K (May 2023) · Total $456,000</text>
    
    <!-- Top Live Badge -->
    <rect x="790" y="2" width="138" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="1"/>
    <circle cx="804" cy="15" r="4" fill="#10B981"/>
    <text x="814" y="19" class="title" font-size="11" fill="#34D399">ACTIVE EDA METRICS</text>
  </g>

  <!-- Left Main Chart: Monthly Sales Curve -->
  <g transform="translate(36, 84)" filter="url(#shadow)">
    <rect width="570" height="346" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="24" y="30" class="title" font-size="14">Monthly Revenue Arc (Jan '23 – Dec '23)</text>
    <text x="24" y="47" class="label">Gross monthly turnover in USD with seasonal peaks</text>
    
    <!-- Chart Legend -->
    <g transform="translate(420, 24)">
      <circle cx="6" cy="6" r="4" fill="#E3A857"/>
      <text x="16" y="10" class="label" fill="#CBD5E1">Monthly Sales</text>
    </g>

    <!-- Chart Canvas Area -->
    <g transform="translate(24, 75)">
      <!-- Horizontal Grid Lines -->
      <line x1="40" y1="0" x2="520" y2="0" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="4" class="mono label" text-anchor="end">$45K</text>

      <line x1="40" y1="50" x2="520" y2="50" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="54" class="mono label" text-anchor="end">$40K</text>

      <line x1="40" y1="100" x2="520" y2="100" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="104" class="mono label" text-anchor="end">$35K</text>

      <line x1="40" y1="150" x2="520" y2="150" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="154" class="mono label" text-anchor="end">$30K</text>

      <line x1="40" y1="200" x2="520" y2="200" stroke="rgba(255,255,255,0.12)"/>
      <text x="32" y="204" class="mono label" text-anchor="end">$25K</text>

      <!-- Area Path -->
      <!-- Points:
           Jan: x=60,  $34.5K -> y=105
           Feb: x=100, $32.8K -> y=122
           Mar: x=140, $35.2K -> y=98
           Apr: x=180, $37.4K -> y=76
           May: x=220, $43.1K -> y=19  (PEAK)
           Jun: x=260, $38.9K -> y=61
           Jul: x=300, $36.7K -> y=83
           Aug: x=340, $39.2K -> y=58
           Sep: x=380, $35.8K -> y=92
           Oct: x=420, $40.5K -> y=45
           Nov: x=460, $39.1K -> y=59
           Dec: x=500, $42.8K -> y=22
      -->
      <path d="M60 105 L100 122 L140 98 L180 76 L220 19 L260 61 L300 83 L340 58 L380 92 L420 45 L460 59 L500 22 L500 200 L60 200 Z" 
            fill="url(#areaGrad)"/>

      <!-- Smooth Curve Line -->
      <path d="M60 105 L100 122 L140 98 L180 76 L220 19 L260 61 L300 83 L340 58 L380 92 L420 45 L460 59 L500 22" 
            fill="none" stroke="#E3A857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGold)"/>

      <!-- Data Dots & Callouts -->
      <circle cx="60" cy="105" r="4" fill="#E3A857"/>
      <circle cx="100" cy="122" r="4" fill="#E3A857"/>
      <circle cx="140" cy="98" r="4" fill="#E3A857"/>
      <circle cx="180" cy="76" r="4" fill="#E3A857"/>
      
      <!-- May Peak Callout -->
      <circle cx="220" cy="19" r="6" fill="#FCD34D" class="peak-pulse"/>
      <circle cx="220" cy="19" r="3.5" fill="#0B111E"/>
      <rect x="186" y="-18" width="68" height="22" rx="6" fill="#E3A857"/>
      <text x="220" y="-4" class="mono" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">$43.1K (Peak)</text>

      <circle cx="260" cy="61" r="4" fill="#E3A857"/>
      <circle cx="300" cy="83" r="4" fill="#E3A857"/>
      <circle cx="340" cy="58" r="4" fill="#E3A857"/>
      <circle cx="380" cy="92" r="4" fill="#E3A857"/>
      <circle cx="420" cy="45" r="4" fill="#E3A857"/>
      <circle cx="460" cy="59" r="4" fill="#E3A857"/>

      <!-- Dec Peak Callout -->
      <circle cx="500" cy="22" r="5" fill="#60A5FA"/>
      <rect x="466" y="-15" width="68" height="22" rx="6" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/>
      <text x="500" y="-1" class="mono" font-size="10.5" font-weight="700" fill="#93C5FD" text-anchor="middle">$42.8K (Dec)</text>

      <!-- Month Labels -->
      <g transform="translate(0, 218)" class="mono label" text-anchor="middle">
        <text x="60" y="0">Jan</text>
        <text x="100" y="0">Feb</text>
        <text x="140" y="0">Mar</text>
        <text x="180" y="0">Apr</text>
        <text x="220" y="0" font-weight="700" fill="#E3A857">May</text>
        <text x="260" y="0">Jun</text>
        <text x="300" y="0">Jul</text>
        <text x="340" y="0">Aug</text>
        <text x="380" y="0">Sep</text>
        <text x="420" y="0">Oct</text>
        <text x="460" y="0">Nov</text>
        <text x="500" y="0" font-weight="700" fill="#60A5FA">Dec</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Breakdown Cards -->
  <!-- 1. Category Share Breakdown -->
  <g transform="translate(624, 84)" filter="url(#shadow)">
    <rect width="340" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="20" y="28" class="title" font-size="13.5">Category Revenue Split</text>
    
    <!-- Electronics Bar -->
    <g transform="translate(20, 48)">
      <text x="0" y="0" class="val" font-size="12">Electronics</text>
      <text x="300" y="0" class="mono val" font-size="12" fill="#60A5FA" text-anchor="end">$156.9K (34.4%)</text>
      <rect x="0" y="7" width="300" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="7" width="103" height="7" rx="3.5" fill="url(#blueGrad)"/>
    </g>

    <!-- Clothing Bar -->
    <g transform="translate(20, 92)">
      <text x="0" y="0" class="val" font-size="12">Clothing</text>
      <text x="300" y="0" class="mono val" font-size="12" fill="#34D399" text-anchor="end">$155.6K (34.1%)</text>
      <rect x="0" y="7" width="300" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="7" width="102" height="7" rx="3.5" fill="url(#tealGrad)"/>
    </g>

    <!-- Beauty Bar -->
    <g transform="translate(20, 136)">
      <text x="0" y="0" class="val" font-size="12">Beauty</text>
      <text x="300" y="0" class="mono val" font-size="12" fill="#FB7185" text-anchor="end">$143.5K (31.5%)</text>
      <rect x="0" y="7" width="300" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="7" width="95" height="7" rx="3.5" fill="url(#coralGrad)"/>
    </g>
  </g>

  <!-- 2. Gender & Spend KPIs Card -->
  <g transform="translate(624, 288)" filter="url(#shadow)">
    <rect width="340" height="142" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="20" y="26" class="title" font-size="13.5">Demographics &amp; Basket Summary</text>
    
    <g transform="translate(20, 48)">
      <!-- Gender Split Pill -->
      <rect x="0" y="0" width="144" height="66" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="12" y="20" class="label">Gender Balance</text>
      <text x="12" y="42" class="mono val" font-size="15" fill="#E3A857">51% ♀ / 49% ♂</text>
      <text x="12" y="56" class="label" font-size="10">Identical $456 AOV</text>

      <!-- Avg Basket Pill -->
      <rect x="156" y="0" width="144" height="66" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="168" y="20" class="label">Avg Order Value</text>
      <text x="168" y="42" class="mono val" font-size="16" fill="#34D399">$456.00</text>
      <text x="168" y="56" class="label" font-size="10">2.51 Units / Txn</text>
    </g>
  </g>
</svg>
