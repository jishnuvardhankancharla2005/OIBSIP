  <!-- ================= GLOBAL FOOTER ================= -->
  <g transform="translate(60, 560)">
    <text x="0" y="0" fill="#7C8399" font-size="11" class="mono">
      METRIC EQUIVALENCE: 100% OF RECOVERED NUMERICAL ROWS STRICTLY VERIFIED (TOTAL == QTY × PRICE)
    </text>
    <text x="1080" y="0" text-anchor="end" fill="#4FA88F" font-size="11" font-weight="600" class="mono">
      STATUS: VERIFIED
    </text>
  </g>
</svg>
