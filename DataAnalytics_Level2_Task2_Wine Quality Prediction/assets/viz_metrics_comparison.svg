<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F080D"/>
      <stop offset="100%" stop-color="#180E16"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241520"/>
      <stop offset="100%" stop-color="#1B0E17"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      .v-title { font-family: 'Fraunces', serif; font-weight: 600; fill: #EDE3E7; }
      .v-font { font-family: 'Inter', sans-serif; }
      .v-mono { font-family: 'JetBrains Mono', monospace; }
      .m-label { font-size: 12px; fill: #8C7482; font-weight: 500; }
      .m-val { font-size: 13px; font-weight: 600; fill: #EDE3E7; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" rx="16" fill="url(#vizBg)" stroke="rgba(237,227,231,0.09)" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 36)" class="v-font">
    <text x="0" y="0" class="v-title" font-size="22">Model Performance Leaderboard</text>
    <text x="0" y="20" font-size="12.5" fill="#A8929F">Evaluated on Stratified 20% Holdout Test Set (320 samples: 13 Low, 264 Medium, 43 High)</text>
  </g>

  <!-- 3 Model Cards -->
  <!-- Card 1: Random Forest (Winner) -->
  <g transform="translate(40, 80)" filter="url(#cardShadow)" class="v-font">
    <rect width="286" height="280" rx="14" fill="url(#cardBg)" stroke="#D3A24C" stroke-width="1.8"/>
    <!-- Winner Ribbon -->
    <rect x="180" y="16" width="90" height="22" rx="11" fill="#D3A24C"/>
    <text x="192" y="31" font-size="10.5" font-weight="700" fill="#1C1019">★ BEST MODEL</text>

    <text x="22" y="34" font-size="16" font-weight="600" fill="#EDE3E7">Random Forest</text>
    <text x="22" y="52" font-size="11.5" fill="#8C7482">200 Estimators · Gini Criterion</text>

    <!-- Big Accuracy Number -->
    <text x="22" y="100" class="v-title" font-size="40" font-weight="600" fill="#D3A24C">86.6%</text>
    <text x="160" y="94" font-size="12" font-weight="600" fill="#6FA07E">Test Accuracy</text>

    <!-- Metrics rows -->
    <g transform="translate(22, 126)">
      <line x1="0" y1="0" x2="242" y2="0" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="22" class="m-label">Weighted F1-Score</text>
      <text x="242" y="22" text-anchor="end" class="v-mono m-val" fill="#D3A24C">0.841</text>

      <line x1="0" y1="34" x2="242" y2="34" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="56" class="m-label">Macro F1-Score</text>
      <text x="242" y="56" text-anchor="end" class="v-mono m-val">0.506</text>

      <line x1="0" y1="68" x2="242" y2="68" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="90" class="m-label">Medium Quality Recall</text>
      <text x="242" y="90" text-anchor="end" class="v-mono m-val" fill="#6FA07E">96.6%</text>

      <line x1="0" y1="102" x2="242" y2="102" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="124" class="m-label">High Quality Recall</text>
      <text x="242" y="124" text-anchor="end" class="v-mono m-val" fill="#6FA07E">51.2%</text>
    </g>
  </g>

  <!-- Card 2: Support Vector Classifier -->
  <g transform="translate(356, 80)" filter="url(#cardShadow)" class="v-font">
    <rect width="286" height="280" rx="14" fill="url(#cardBg)" stroke="rgba(237,227,231,0.12)" stroke-width="1"/>
    <text x="22" y="34" font-size="16" font-weight="600" fill="#EDE3E7">SVC (Support Vector)</text>
    <text x="22" y="52" font-size="11.5" fill="#8C7482">RBF Kernel · C=1.0 · gamma='scale'</text>

    <text x="22" y="100" class="v-title" font-size="40" font-weight="600" fill="#EDE3E7">84.4%</text>
    <text x="160" y="94" font-size="12" font-weight="600" fill="#C4AEBA">Test Accuracy</text>

    <!-- Metrics rows -->
    <g transform="translate(22, 126)">
      <line x1="0" y1="0" x2="242" y2="0" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="22" class="m-label">Weighted F1-Score</text>
      <text x="242" y="22" text-anchor="end" class="v-mono m-val">0.810</text>

      <line x1="0" y1="34" x2="242" y2="34" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="56" class="m-label">Macro F1-Score</text>
      <text x="242" y="56" text-anchor="end" class="v-mono m-val">0.447</text>

      <line x1="0" y1="68" x2="242" y2="68" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="90" class="m-label">Medium Quality Recall</text>
      <text x="242" y="90" text-anchor="end" class="v-mono m-val" fill="#6FA07E">97.0%</text>

      <line x1="0" y1="102" x2="242" y2="102" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="124" class="m-label">High Quality Recall</text>
      <text x="242" y="124" text-anchor="end" class="v-mono m-val" fill="#D3A24C">32.6%</text>
    </g>
  </g>

  <!-- Card 3: SGD Classifier -->
  <g transform="translate(672, 80)" filter="url(#cardShadow)" class="v-font">
    <rect width="286" height="280" rx="14" fill="url(#cardBg)" stroke="rgba(237,227,231,0.12)" stroke-width="1"/>
    <text x="22" y="34" font-size="16" font-weight="600" fill="#EDE3E7">SGD Classifier</text>
    <text x="22" y="52" font-size="11.5" fill="#8C7482">Stochastic Gradient Descent · Linear</text>

    <text x="22" y="100" class="v-title" font-size="40" font-weight="600" fill="#EDE3E7">82.5%</text>
    <text x="160" y="94" font-size="12" font-weight="600" fill="#C4AEBA">Test Accuracy</text>

    <!-- Metrics rows -->
    <g transform="translate(22, 126)">
      <line x1="0" y1="0" x2="242" y2="0" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="22" class="m-label">Weighted F1-Score</text>
      <text x="242" y="22" text-anchor="end" class="v-mono m-val">0.796</text>

      <line x1="0" y1="34" x2="242" y2="34" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="56" class="m-label">Macro F1-Score</text>
      <text x="242" y="56" text-anchor="end" class="v-mono m-val">0.433</text>

      <line x1="0" y1="68" x2="242" y2="68" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="90" class="m-label">Medium Quality Recall</text>
      <text x="242" y="90" text-anchor="end" class="v-mono m-val" fill="#6FA07E">94.7%</text>

      <line x1="0" y1="102" x2="242" y2="102" stroke="rgba(237,227,231,0.08)"/>
      <text x="0" y="124" class="m-label">High Quality Recall</text>
      <text x="242" y="124" text-anchor="end" class="v-mono m-val" fill="#D3A24C">32.6%</text>
    </g>
  </g>
</svg>
