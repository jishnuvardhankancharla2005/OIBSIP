<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F080D"/>
      <stop offset="100%" stop-color="#180E16"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B3802C"/>
      <stop offset="100%" stop-color="#D3A24C"/>
    </linearGradient>
    <linearGradient id="barSage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B7756"/>
      <stop offset="100%" stop-color="#6FA07E"/>
    </linearGradient>
    <linearGradient id="barBrick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C3F34"/>
      <stop offset="100%" stop-color="#B85C4F"/>
    </linearGradient>
    <style>
      .fi-title { font-family: 'Fraunces', serif; font-weight: 600; fill: #EDE3E7; }
      .fi-font { font-family: 'Inter', sans-serif; }
      .fi-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #EDE3E7; }
      .feat-label { font-size: 12px; font-weight: 500; fill: #C4AEBA; }
    </style>
  </defs>

  <rect width="1000" height="450" rx="16" fill="url(#fiBg)" stroke="rgba(237,227,231,0.09)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 36)" class="fi-font">
    <text x="0" y="0" class="fi-title" font-size="22">Random Forest Feature Importance &amp; Linear Correlation</text>
    <text x="0" y="20" font-size="12.5" fill="#A8929F">Relative Gini Importance (Random Forest 200 trees) vs. Pearson Correlation Coefficient (r) with Wine Quality</text>
  </g>

  <!-- Left: Feature Importance Bars (0% to 16%) -->
  <g transform="translate(40, 80)" class="fi-font">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#D3A24C">RANDOM FOREST GINI IMPORTANCE</text>

    <!-- Bar 1: Alcohol (14.8%) -->
    <g transform="translate(0, 24)">
      <text x="0" y="14" class="feat-label">Alcohol</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="231" height="18" rx="4" fill="url(#barGold)"/>
      <text x="380" y="14" class="fi-mono">14.8%</text>
    </g>

    <!-- Bar 2: Volatile Acidity (12.8%) -->
    <g transform="translate(0, 52)">
      <text x="0" y="14" class="feat-label">Volatile Acidity</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="200" height="18" rx="4" fill="url(#barGold)"/>
      <text x="350" y="14" class="fi-mono">12.8%</text>
    </g>

    <!-- Bar 3: Sulphates (10.6%) -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" class="feat-label">Sulphates</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="165" height="18" rx="4" fill="url(#barGold)"/>
      <text x="315" y="14" class="fi-mono">10.6%</text>
    </g>

    <!-- Bar 4: Density (9.2%) -->
    <g transform="translate(0, 108)">
      <text x="0" y="14" class="feat-label">Density</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="143" height="18" rx="4" fill="url(#barGold)"/>
      <text x="293" y="14" class="fi-mono">9.2%</text>
    </g>

    <!-- Bar 5: Citric Acid (8.9%) -->
    <g transform="translate(0, 136)">
      <text x="0" y="14" class="feat-label">Citric Acid</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="139" height="18" rx="4" fill="url(#barGold)"/>
      <text x="289" y="14" class="fi-mono">8.9%</text>
    </g>

    <!-- Bar 6: Fixed Acidity (8.2%) -->
    <g transform="translate(0, 164)">
      <text x="0" y="14" class="feat-label">Fixed Acidity</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="128" height="18" rx="4" fill="url(#barGold)"/>
      <text x="278" y="14" class="fi-mono">8.2%</text>
    </g>

    <!-- Bar 7: Total SO2 (8.0%) -->
    <g transform="translate(0, 192)">
      <text x="0" y="14" class="feat-label">Total SO2</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="125" height="18" rx="4" fill="url(#barGold)"/>
      <text x="275" y="14" class="fi-mono">8.0%</text>
    </g>

    <!-- Bar 8: Chlorides (7.3%) -->
    <g transform="translate(0, 220)">
      <text x="0" y="14" class="feat-label">Chlorides</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="114" height="18" rx="4" fill="url(#barGold)"/>
      <text x="264" y="14" class="fi-mono">7.3%</text>
    </g>

    <!-- Bar 9: Residual Sugar (7.2%) -->
    <g transform="translate(0, 248)">
      <text x="0" y="14" class="feat-label">Residual Sugar</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="112" height="18" rx="4" fill="url(#barGold)"/>
      <text x="262" y="14" class="fi-mono">7.2%</text>
    </g>

    <!-- Bar 10: pH (6.8%) -->
    <g transform="translate(0, 276)">
      <text x="0" y="14" class="feat-label">pH</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="106" height="18" rx="4" fill="url(#barGold)"/>
      <text x="256" y="14" class="fi-mono">6.8%</text>
    </g>

    <!-- Bar 11: Free SO2 (6.2%) -->
    <g transform="translate(0, 304)">
      <text x="0" y="14" class="feat-label">Free SO2</text>
      <rect x="140" y="0" width="250" height="18" rx="4" fill="rgba(237,227,231,0.06)"/>
      <rect x="140" y="0" width="97" height="18" rx="4" fill="url(#barGold)"/>
      <text x="247" y="14" class="fi-mono">6.2%</text>
    </g>
  </g>

  <!-- Right: Correlation Coefficients with Quality (-0.5 to +0.5) -->
  <g transform="translate(540, 80)" class="fi-font">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#6FA07E">PEARSON CORRELATION (r)</text>

    <!-- Center zero line at X = 200 -->
    <line x1="200" y1="20" x2="200" y2="330" stroke="rgba(237,227,231,0.2)" stroke-width="1.5"/>

    <!-- Alcohol (+0.48) -->
    <g transform="translate(0, 24)">
      <text x="0" y="14" class="feat-label">Alcohol</text>
      <rect x="200" y="0" width="168" height="18" rx="4" fill="url(#barSage)"/>
      <text x="375" y="14" class="fi-mono" fill="#6FA07E">+0.476</text>
    </g>

    <!-- Sulphates (+0.25) -->
    <g transform="translate(0, 52)">
      <text x="0" y="14" class="feat-label">Sulphates</text>
      <rect x="200" y="0" width="88" height="18" rx="4" fill="url(#barSage)"/>
      <text x="295" y="14" class="fi-mono" fill="#6FA07E">+0.251</text>
    </g>

    <!-- Citric Acid (+0.23) -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" class="feat-label">Citric Acid</text>
      <rect x="200" y="0" width="80" height="18" rx="4" fill="url(#barSage)"/>
      <text x="287" y="14" class="fi-mono" fill="#6FA07E">+0.226</text>
    </g>

    <!-- Fixed Acidity (+0.12) -->
    <g transform="translate(0, 108)">
      <text x="0" y="14" class="feat-label">Fixed Acidity</text>
      <rect x="200" y="0" width="44" height="18" rx="4" fill="url(#barSage)"/>
      <text x="251" y="14" class="fi-mono" fill="#6FA07E">+0.124</text>
    </g>

    <!-- Residual Sugar (+0.01) -->
    <g transform="translate(0, 136)">
      <text x="0" y="14" class="feat-label">Residual Sugar</text>
      <rect x="200" y="0" width="8" height="18" rx="2" fill="url(#barSage)"/>
      <text x="215" y="14" class="fi-mono" fill="#6FA07E">+0.014</text>
    </g>

    <!-- Free SO2 (-0.05) -->
    <g transform="translate(0, 164)">
      <text x="0" y="14" class="feat-label">Free SO2</text>
      <rect x="182" y="0" width="18" height="18" rx="3" fill="url(#barBrick)"/>
      <text x="135" y="14" class="fi-mono" fill="#B85C4F">-0.051</text>
    </g>

    <!-- pH (-0.06) -->
    <g transform="translate(0, 192)">
      <text x="0" y="14" class="feat-label">pH</text>
      <rect x="180" y="0" width="20" height="18" rx="3" fill="url(#barBrick)"/>
      <text x="133" y="14" class="fi-mono" fill="#B85C4F">-0.058</text>
    </g>

    <!-- Chlorides (-0.13) -->
    <g transform="translate(0, 220)">
      <text x="0" y="14" class="feat-label">Chlorides</text>
      <rect x="155" y="0" width="45" height="18" rx="4" fill="url(#barBrick)"/>
      <text x="108" y="14" class="fi-mono" fill="#B85C4F">-0.129</text>
    </g>

    <!-- Density (-0.17) -->
    <g transform="translate(0, 248)">
      <text x="0" y="14" class="feat-label">Density</text>
      <rect x="139" y="0" width="61" height="18" rx="4" fill="url(#barBrick)"/>
      <text x="92" y="14" class="fi-mono" fill="#B85C4F">-0.175</text>
    </g>

    <!-- Total SO2 (-0.19) -->
    <g transform="translate(0, 276)">
      <text x="0" y="14" class="feat-label">Total SO2</text>
      <rect x="135" y="0" width="65" height="18" rx="4" fill="url(#barBrick)"/>
      <text x="88" y="14" class="fi-mono" fill="#B85C4F">-0.185</text>
    </g>

    <!-- Volatile Acidity (-0.39) -->
    <g transform="translate(0, 304)">
      <text x="0" y="14" class="feat-label">Volatile Acidity</text>
      <rect x="63" y="0" width="137" height="18" rx="4" fill="url(#barBrick)"/>
      <text x="16" y="14" class="fi-mono" fill="#B85C4F">-0.391</text>
    </g>
  </g>
</svg>
