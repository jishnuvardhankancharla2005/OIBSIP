<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="50%" stop-color="#0D1627"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152136"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>

    <!-- Cluster Colors -->
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="tealGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="redGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>

    <!-- Line Area Gradients -->
    <linearGradient id="elbowArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowElbow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; fill: #F8FAFC; }
      .sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #94A3B8; font-size: 13px; }
      .label { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #64748B; font-size: 11px; }
      .val { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 600; fill: #F1F5F9; font-size: 13px; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }

      @keyframes pulseK {
        0%, 100% { r: 6px; opacity: 1; }
        50% { r: 9px; opacity: 0.6; }
      }
      .k-pulse { animation: pulseK 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="440" rx="18" fill="url(#bgGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(36, 30)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="rgba(59,130,246,0.15)" stroke="#3B82F6" stroke-width="1"/>
    <!-- Clusters icon -->
    <circle cx="11" cy="11" r="3.5" fill="#60A5FA"/>
    <circle cx="21" cy="12" r="3" fill="#FCD34D"/>
    <circle cx="13" cy="21" r="3" fill="#34D399"/>
    <circle cx="21" cy="21" r="3.5" fill="#F87171"/>
    <text x="44" y="16" class="title" font-size="18">Optimal Cluster Validation (Elbow &amp; Silhouette) &amp; Personas</text>
    <text x="44" y="32" class="sub">Rigorous Mathematical Selection of K=4 Partitions across 1,534 RFM Profiles</text>

    <!-- Optimal Badge -->
    <rect x="800" y="2" width="138" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="1"/>
    <circle cx="814" cy="15" r="4" fill="#10B981"/>
    <text x="824" y="19" class="title" font-size="11" fill="#34D399">OPTIMAL K = 4</text>
  </g>

  <!-- Left Card: Elbow Inertia & Silhouette Curve -->
  <g transform="translate(36, 80)" filter="url(#shadow3)">
    <rect width="460" height="330" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="24" y="28" class="title" font-size="14">Elbow Inertia Curve (WSS vs K)</text>
    <text x="24" y="44" class="label">Pronounced elbow bend at K=4 with Silhouette peak (0.42)</text>

    <!-- Chart Canvas -->
    <g transform="translate(24, 68)">
      <!-- Gridlines -->
      <line x1="40" y1="0" x2="400" y2="0" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="4" class="mono label" text-anchor="end">4.5k</text>

      <line x1="40" y1="45" x2="400" y2="45" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="49" class="mono label" text-anchor="end">3.0k</text>

      <line x1="40" y1="90" x2="400" y2="90" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="94" class="mono label" text-anchor="end">2.0k</text>

      <line x1="40" y1="135" x2="400" y2="135" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
      <text x="32" y="139" class="mono label" text-anchor="end">1.0k</text>

      <line x1="40" y1="180" x2="400" y2="180" stroke="rgba(255,255,255,0.12)"/>
      <text x="32" y="184" class="mono label" text-anchor="end">0.0</text>

      <!-- Curve Coordinates:
           K=1: x=60,  y=15
           K=2: x=105, y=60
           K=3: x=150, y=98
           K=4: x=195, y=128 (ELBOW KNEE)
           K=5: x=240, y=145
           K=6: x=285, y=156
           K=7: x=330, y=164
           K=8: x=375, y=170
      -->
      <path d="M60 15 L105 60 L150 98 L195 128 L240 145 L285 156 L330 164 L375 170 L375 180 L60 180 Z" fill="url(#elbowArea)"/>
      <path d="M60 15 L105 60 L150 98 L195 128 L240 145 L285 156 L330 164 L375 170" fill="none" stroke="#3B82F6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Dots -->
      <circle cx="60" cy="15" r="4" fill="#60A5FA"/>
      <circle cx="105" cy="60" r="4" fill="#60A5FA"/>
      <circle cx="150" cy="98" r="4" fill="#60A5FA"/>

      <!-- Optimal K=4 Knee -->
      <circle cx="195" cy="128" r="6" fill="#10B981" class="k-pulse"/>
      <circle cx="195" cy="128" r="3.5" fill="#070D18"/>
      <rect x="155" y="86" width="80" height="24" rx="6" fill="#065F46" stroke="#10B981" stroke-width="1.2" filter="url(#glowElbow)"/>
      <text x="195" y="102" class="mono" font-size="10.5" font-weight="700" fill="#6EE7B7" text-anchor="middle">★ K = 4 Knee</text>

      <circle cx="240" cy="145" r="4" fill="#60A5FA"/>
      <circle cx="285" cy="156" r="4" fill="#60A5FA"/>
      <circle cx="330" cy="164" r="4" fill="#60A5FA"/>
      <circle cx="375" cy="170" r="4" fill="#60A5FA"/>

      <!-- X-Axis Labels -->
      <g transform="translate(0, 198)" class="mono label" text-anchor="middle">
        <text x="60" y="0">K=1</text>
        <text x="105" y="0">K=2</text>
        <text x="150" y="0">K=3</text>
        <text x="195" y="0" font-weight="700" fill="#10B981">K=4</text>
        <text x="240" y="0">K=5</text>
        <text x="285" y="0">K=6</text>
        <text x="330" y="0">K=7</text>
        <text x="375" y="0">K=8</text>
      </g>
    </g>

    <!-- Bottom summary row -->
    <g transform="translate(24, 280)">
      <rect width="412" height="34" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
      <text x="14" y="21" class="mono val" font-size="11" fill="#34D399">Silhouette Score: 0.42 · WSS Inertia drop rate stabilizes at K=4</text>
    </g>
  </g>

  <!-- Right Card: 4 Customer Personas Breakdown -->
  <g transform="translate(514, 80)" filter="url(#shadow3)">
    <rect width="450" height="330" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="22" y="28" class="title" font-size="14">Customer Segment Personas (1,534 Profiles)</text>
    
    <!-- Persona 1: High-Value Spenders (Gold) -->
    <g transform="translate(22, 46)">
      <rect width="406" height="58" rx="8" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.3)"/>
      <circle cx="20" cy="29" r="6" fill="#F59E0B"/>
      <text x="36" y="22" class="title" font-size="12.5" fill="#FCD34D">Cluster 3: High-Value Spenders</text>
      <text x="36" y="42" class="sub" font-size="11">Avg Spend: $2,180 · Freq: 1.4 · Recency: 280d</text>
      <rect x="310" y="16" width="82" height="24" rx="6" fill="rgba(245,158,11,0.2)"/>
      <text x="351" y="32" class="mono" font-size="10.5" font-weight="700" fill="#FDE68A" text-anchor="middle">👑 VIP (9.8%)</text>
    </g>

    <!-- Persona 2: Loyal Repeat Customers (Teal) -->
    <g transform="translate(22, 112)">
      <rect width="406" height="58" rx="8" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.3)"/>
      <circle cx="20" cy="29" r="6" fill="#10B981"/>
      <text x="36" y="22" class="title" font-size="12.5" fill="#6EE7B7">Cluster 2: Loyal Repeat Customers</text>
      <text x="36" y="42" class="sub" font-size="11">Avg Spend: $1,420 · Freq: 3.6 · Recency: 145d</text>
      <rect x="310" y="16" width="82" height="24" rx="6" fill="rgba(16,185,129,0.2)"/>
      <text x="351" y="32" class="mono" font-size="10.5" font-weight="700" fill="#A7F3D0" text-anchor="middle">🎁 Tiered (18.5%)</text>
    </g>

    <!-- Persona 3: New / Recent One-Time (Blue) -->
    <g transform="translate(22, 178)">
      <rect width="406" height="58" rx="8" fill="rgba(59,130,246,0.07)" stroke="rgba(59,130,246,0.3)"/>
      <circle cx="20" cy="29" r="6" fill="#3B82F6"/>
      <text x="36" y="22" class="title" font-size="12.5" fill="#93C5FD">Cluster 0: New / Recent One-Time</text>
      <text x="36" y="42" class="sub" font-size="11">Avg Spend: $340 · Freq: 1.0 · Recency: 95d</text>
      <rect x="310" y="16" width="82" height="24" rx="6" fill="rgba(59,130,246,0.2)"/>
      <text x="351" y="32" class="mono" font-size="10.5" font-weight="700" fill="#BFDBFE" text-anchor="middle">🚀 Nurture (37.2%)</text>
    </g>

    <!-- Persona 4: Lapsed / At-Risk (Red) -->
    <g transform="translate(22, 244)">
      <rect width="406" height="58" rx="8" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.3)"/>
      <circle cx="20" cy="29" r="6" fill="#EF4444"/>
      <text x="36" y="22" class="title" font-size="12.5" fill="#FCA5A5">Cluster 1: Lapsed / At-Risk</text>
      <text x="36" y="42" class="sub" font-size="11">Avg Spend: $290 · Freq: 1.0 · Recency: 740d</text>
      <rect x="310" y="16" width="82" height="24" rx="6" fill="rgba(239,68,68,0.2)"/>
      <text x="351" y="32" class="mono" font-size="10.5" font-weight="700" fill="#FECACA" text-anchor="middle">⏳ Win-Back (34.5%)</text>
    </g>
  </g>
</svg>
