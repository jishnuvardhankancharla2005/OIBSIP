<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F1422"/>
      <stop offset="100%" stop-color="#090D17"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182032" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111724" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3A857" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5C070" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FA88F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6ED4B8" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6FA1D6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9BC4F5" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="glowBrick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C1594A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E87D6E" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3A857"/>
      <stop offset="35%" stop-color="#4FA88F"/>
      <stop offset="70%" stop-color="#6FA1D6"/>
      <stop offset="100%" stop-color="#C1594A"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fraunces:wght@600&amp;display=swap');
      
      .title { font-family: 'Fraunces', serif; font-size: 26px; fill: #EDEAE2; font-weight: 600; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #7C8399; font-weight: 400; letter-spacing: 0.5px; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 14px; fill: #EDEAE2; font-weight: 600; }
      .card-subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #7C8399; font-weight: 400; }
      .badge-text { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .step-num { font-family: 'Fraunces', serif; font-size: 13px; fill: #E3A857; font-weight: 600; }
      .detail-text { font-family: 'Inter', sans-serif; font-size: 10.5px; fill: #B7BCCB; }
      .cluster-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; }

      /* Animated Elements */
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: flowAnimation 25s linear infinite;
      }
      .flow-path-fast {
        stroke-dasharray: 6, 6;
        animation: flowAnimation 15s linear infinite;
      }
      .flow-path-reverse {
        stroke-dasharray: 8, 8;
        animation: flowReverse 25s linear infinite;
      }
      @keyframes flowAnimation {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 400; }
      }

      .pulse-node {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { filter: drop-shadow(0 0 2px rgba(227,168,87,0.3)); opacity: 0.85; }
        100% { filter: drop-shadow(0 0 12px rgba(227,168,87,0.85)); opacity: 1; }
      }

      .pulse-teal {
        animation: pulseTeal 3.5s ease-in-out infinite alternate;
      }
      @keyframes pulseTeal {
        0% { filter: drop-shadow(0 0 2px rgba(79,168,143,0.3)); opacity: 0.85; }
        100% { filter: drop-shadow(0 0 12px rgba(79,168,143,0.85)); opacity: 1; }
      }

      .pulse-blue {
        animation: pulseBlue 4s ease-in-out infinite alternate;
      }
      @keyframes pulseBlue {
        0% { filter: drop-shadow(0 0 2px rgba(111,161,214,0.3)); opacity: 0.85; }
        100% { filter: drop-shadow(0 0 12px rgba(111,161,214,0.85)); opacity: 1; }
      }

      .pulse-brick {
        animation: pulseBrick 3.2s ease-in-out infinite alternate;
      }
      @keyframes pulseBrick {
        0% { filter: drop-shadow(0 0 2px rgba(193,89,74,0.3)); opacity: 0.85; }
        100% { filter: drop-shadow(0 0 12px rgba(193,89,74,0.85)); opacity: 1; }
      }

      .hover-card {
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="680" rx="16" fill="none" stroke="rgba(237,234,226,0.08)" stroke-width="1.5"/>

  <!-- Background Grid Accent -->
  <g opacity="0.08">
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200 M0,320 H1200 M0,400 H1200 M0,480 H1200 M0,560 H1200 M0,640 H1200" stroke="#EDEAE2" stroke-width="0.5"/>
    <path d="M100,0 V680 M200,0 V680 M300,0 V680 M400,0 V680 M500,0 V680 M600,0 V680 M700,0 V680 M800,0 V680 M900,0 V680 M1000,0 V680 M1100,0 V680" stroke="#EDEAE2" stroke-width="0.5"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="140" fill="#E3A857" opacity="0.04" filter="url(#glowEffect)"/>
  <circle cx="600" cy="340" r="180" fill="#4FA88F" opacity="0.04" filter="url(#glowEffect)"/>
  <circle cx="1020" cy="420" r="160" fill="#6FA1D6" opacity="0.04" filter="url(#glowEffect)"/>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <circle cx="10" cy="10" r="5" fill="#E3A857"/>
    <text x="26" y="14" class="subtitle" font-weight="600" fill="#E3A857" letter-spacing="1.5">END-TO-END DATA INTELLIGENCE ARCHITECTURE</text>
    <text x="0" y="44" class="title">Customer Segmentation &amp; Clustering Pipeline</text>
    <text x="0" y="66" class="subtitle">2,000 Global E-Commerce Transactions &#8594; 1,534 RFM Customer Profiles &#8594; K-Means (K=4) Machine Learning &#8594; Live Interactive Dashboard</text>
    <line x1="0" y1="78" x2="1080" y2="78" stroke="url(#accentLine)" stroke-width="2" opacity="0.75"/>
  </g>

  <!-- Animated Connection Pipes -->
  <g fill="none" stroke-width="2.5">
    <!-- Stage 1 -> Stage 2 -->
    <path d="M 230,245 L 300,245" stroke="#E3A857" class="flow-path-fast" opacity="0.85"/>
    <circle cx="265" cy="245" r="3" fill="#E3A857" filter="url(#glowEffect)"/>

    <!-- Stage 2 -> Stage 3 -->
    <path d="M 480,245 L 550,245" stroke="#4FA88F" class="flow-path-fast" opacity="0.85"/>
    <circle cx="515" cy="245" r="3" fill="#4FA88F" filter="url(#glowEffect)"/>

    <!-- Stage 3 -> Stage 4 -->
    <path d="M 730,245 L 800,245" stroke="#6FA1D6" class="flow-path-fast" opacity="0.85"/>
    <circle cx="765" cy="245" r="3" fill="#6FA1D6" filter="url(#glowEffect)"/>

    <!-- Stage 4 -> Cluster Branches -->
    <path d="M 980,220 C 1020,220 1030,170 1060,170" stroke="#E3A857" class="flow-path" opacity="0.8"/>
    <path d="M 980,235 C 1020,235 1030,240 1060,240" stroke="#4FA88F" class="flow-path" opacity="0.8"/>
    <path d="M 980,255 C 1020,255 1030,310 1060,310" stroke="#6FA1D6" class="flow-path" opacity="0.8"/>
    <path d="M 980,270 C 1020,270 1030,380 1060,380" stroke="#C1594A" class="flow-path" opacity="0.8"/>

    <!-- Stage 4 -> Bottom Dashboard -->
    <path d="M 890,325 L 890,465 C 890,485 870,485 830,485 L 60,485" stroke="rgba(237,234,226,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- ==================== STAGE 1: RAW INGESTION ==================== -->
  <g transform="translate(50, 160)" class="hover-card">
    <rect width="180" height="170" rx="12" fill="url(#cardGrad)" stroke="rgba(227,168,87,0.4)" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="14" y="14" width="46" height="18" rx="4" fill="rgba(227,168,87,0.15)"/>
    <text x="37" y="27" text-anchor="middle" class="badge-text" fill="#E3A857">STAGE 01</text>
    
    <text x="14" y="54" class="card-title">Data Ingestion</text>
    <text x="14" y="69" class="card-subtitle">E-Commerce Transactions</text>

    <!-- Metrics Inside -->
    <g transform="translate(14, 85)">
      <rect width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="15" class="detail-text">&#10003; 2,000 Order Records</text>
      
      <rect y="26" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="41" class="detail-text">&#10003; 2023 - 2025 Timeline</text>
      
      <rect y="52" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="67" class="detail-text">&#10003; 5 Global Sales Regions</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: RFM FEATURE ENGINEERING ==================== -->
  <g transform="translate(300, 160)" class="hover-card">
    <rect width="180" height="170" rx="12" fill="url(#cardGrad)" stroke="rgba(79,168,143,0.4)" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="14" y="14" width="46" height="18" rx="4" fill="rgba(79,168,143,0.15)"/>
    <text x="37" y="27" text-anchor="middle" class="badge-text" fill="#4FA88F">STAGE 02</text>
    
    <text x="14" y="54" class="card-title">RFM Aggregation</text>
    <text x="14" y="69" class="card-subtitle">Customer-Level Features</text>

    <!-- Metrics Inside -->
    <g transform="translate(14, 85)">
      <rect width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="15" class="detail-text"><tspan fill="#4FA88F" font-weight="600">R</tspan>ecency (1 - 1,095 days)</text>
      
      <rect y="26" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="41" class="detail-text"><tspan fill="#4FA88F" font-weight="600">F</tspan>requency (1 - 5 orders)</text>
      
      <rect y="52" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="67" class="detail-text"><tspan fill="#4FA88F" font-weight="600">M</tspan>onetary ($3.5k max)</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: PREPROCESSING & OPTIMIZATION ==================== -->
  <g transform="translate(550, 160)" class="hover-card">
    <rect width="180" height="170" rx="12" fill="url(#cardGrad)" stroke="rgba(111,161,214,0.4)" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="14" y="14" width="46" height="18" rx="4" fill="rgba(111,161,214,0.15)"/>
    <text x="37" y="27" text-anchor="middle" class="badge-text" fill="#6FA1D6">STAGE 03</text>
    
    <text x="14" y="54" class="card-title">Scaling &amp; Tuning</text>
    <text x="14" y="69" class="card-subtitle">Cluster Optimization</text>

    <!-- Metrics Inside -->
    <g transform="translate(14, 85)">
      <rect width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="15" class="detail-text">&#9881; StandardScaler (z-score)</text>
      
      <rect y="26" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="41" class="detail-text">&#128200; Elbow Method (K=4)</text>
      
      <rect y="52" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="67" class="detail-text">&#9678; Silhouette Score Metric</text>
    </g>
  </g>

  <!-- ==================== STAGE 4: K-MEANS MACHINE LEARNING ==================== -->
  <g transform="translate(800, 160)" class="hover-card">
    <rect width="180" height="170" rx="12" fill="url(#cardGrad)" stroke="rgba(227,168,87,0.7)" stroke-width="1.5" filter="url(#shadow)" class="pulse-node"/>
    <rect x="14" y="14" width="46" height="18" rx="4" fill="rgba(227,168,87,0.2)"/>
    <text x="37" y="27" text-anchor="middle" class="badge-text" fill="#E3A857">STAGE 04</text>
    
    <text x="14" y="54" class="card-title">K-Means Engine</text>
    <text x="14" y="69" class="card-subtitle">Unsupervised Partition</text>

    <!-- Metrics Inside -->
    <g transform="translate(14, 85)">
      <rect width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="15" class="detail-text">&#9673; Optimal K = 4 Clusters</text>
      
      <rect y="26" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="41" class="detail-text">&#9673; 1,534 Classified Users</text>
      
      <rect y="52" width="152" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="67" class="detail-text">&#9673; 3D Hyperplane Split</text>
    </g>
  </g>

  <!-- ==================== CLUSTER PERSONA NODES (RIGHT) ==================== -->
  <!-- Cluster 3: High-Value -->
  <g transform="translate(1040, 148)" class="pulse-node">
    <rect width="125" height="46" rx="8" fill="#1B2232" stroke="#E3A857" stroke-width="1.2"/>
    <circle cx="14" cy="23" r="4" fill="#E3A857"/>
    <text x="26" y="20" class="cluster-title" fill="#EDEAE2">High-Value</text>
    <text x="26" y="34" class="detail-text" fill="#E3A857">VIP &amp; Retain ($1.6k+)</text>
  </g>

  <!-- Cluster 2: Loyal Repeat -->
  <g transform="translate(1040, 218)" class="pulse-teal">
    <rect width="125" height="46" rx="8" fill="#1B2232" stroke="#4FA88F" stroke-width="1.2"/>
    <circle cx="14" cy="23" r="4" fill="#4FA88F"/>
    <text x="26" y="20" class="cluster-title" fill="#EDEAE2">Loyal Repeat</text>
    <text x="26" y="34" class="detail-text" fill="#4FA88F">Cross-Sell &amp; Points</text>
  </g>

  <!-- Cluster 0: New / Recent -->
  <g transform="translate(1040, 288)" class="pulse-blue">
    <rect width="125" height="46" rx="8" fill="#1B2232" stroke="#6FA1D6" stroke-width="1.2"/>
    <circle cx="14" cy="23" r="4" fill="#6FA1D6"/>
    <text x="26" y="20" class="cluster-title" fill="#EDEAE2">New / Recent</text>
    <text x="26" y="34" class="detail-text" fill="#6FA1D6">2nd Order Nurturing</text>
  </g>

  <!-- Cluster 1: Lapsed / At-Risk -->
  <g transform="translate(1040, 358)" class="pulse-brick">
    <rect width="125" height="46" rx="8" fill="#1B2232" stroke="#C1594A" stroke-width="1.2"/>
    <circle cx="14" cy="23" r="4" fill="#C1594A"/>
    <text x="26" y="20" class="cluster-title" fill="#EDEAE2">Lapsed / At-Risk</text>
    <text x="26" y="34" class="detail-text" fill="#C1594A">Light Re-engagement</text>
  </g>

  <!-- ==================== STAGE 5: PRESENTATION LAYER (BOTTOM) ==================== -->
  <g transform="translate(50, 480)">
    <rect width="1100" height="155" rx="12" fill="url(#cardGrad)" stroke="rgba(237,234,226,0.12)" stroke-width="1.2" filter="url(#shadow)"/>
    
    <!-- Left Intro -->
    <g transform="translate(24, 24)">
      <rect width="64" height="20" rx="4" fill="rgba(227,168,87,0.15)"/>
      <text x="32" y="14" text-anchor="middle" class="badge-text" fill="#E3A857">STAGE 05</text>
      <text x="0" y="48" class="card-title">Interactive Intelligence Deck</text>
      <text x="0" y="66" class="card-subtitle">Zero-dependency, real-time client analytics</text>
      <text x="0" y="86" class="detail-text" fill="#7C8399">Built with Chart.js 4.4 + Vanilla JS + CSS</text>
      <text x="0" y="104" class="detail-text" fill="#7C8399">Multi-layer CDN + Local Offline Fallback</text>
    </g>

    <!-- Dashboard Modules Mini-Cards -->
    <!-- Module 1: Live KPIs -->
    <g transform="translate(260, 20)">
      <rect width="190" height="115" rx="8" fill="#161D2E" stroke="rgba(237,234,226,0.08)"/>
      <text x="14" y="26" class="cluster-title" fill="#EDEAE2">&#128202; Dynamic KPIs</text>
      <text x="14" y="48" class="detail-text">&#8226; Live customer count</text>
      <text x="14" y="68" class="detail-text">&#8226; Avg. Lifetime Value ($)</text>
      <text x="14" y="88" class="detail-text">&#8226; Real-time slice delta %</text>
    </g>

    <!-- Module 2: RFM & Scatter Charts -->
    <g transform="translate(470, 20)">
      <rect width="200" height="115" rx="8" fill="#161D2E" stroke="rgba(237,234,226,0.08)"/>
      <text x="14" y="26" class="cluster-title" fill="#EDEAE2">&#128200; Visual Explorers</text>
      <text x="14" y="48" class="detail-text">&#8226; Interactive RFM distributions</text>
      <text x="14" y="68" class="detail-text">&#8226; 2D R-M &amp; F-M scatter plots</text>
      <text x="14" y="88" class="detail-text">&#8226; Elbow &amp; Silhouette metrics</text>
    </g>

    <!-- Module 3: Segment Cards & Top Table -->
    <g transform="translate(690, 20)">
      <rect width="190" height="115" rx="8" fill="#161D2E" stroke="rgba(237,234,226,0.08)"/>
      <text x="14" y="26" class="cluster-title" fill="#EDEAE2">&#128101; Persona Matrix</text>
      <text x="14" y="48" class="detail-text">&#8226; 4 interactive persona cards</text>
      <text x="14" y="68" class="detail-text">&#8226; Segment distribution chart</text>
      <text x="14" y="88" class="detail-text">&#8226; Top 10 customer rank table</text>
    </g>

    <!-- Module 4: Marketing Directives -->
    <g transform="translate(900, 20)">
      <rect width="180" height="115" rx="8" fill="#161D2E" stroke="rgba(237,234,226,0.08)"/>
      <text x="14" y="26" class="cluster-title" fill="#EDEAE2">&#128161; Action Directives</text>
      <text x="14" y="48" class="detail-text">&#8226; VIP margin protection</text>
      <text x="14" y="68" class="detail-text">&#8226; Loyalty cross-sell</text>
      <text x="14" y="88" class="detail-text">&#8226; Re-engagement limits</text>
    </g>
  </g>
</svg>
