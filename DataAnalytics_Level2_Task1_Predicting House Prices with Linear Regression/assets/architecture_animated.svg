<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141C2B"/>
      <stop offset="60%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="accentCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCopper" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .node-title { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    .node-desc { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 400; fill: #94A3B8; line-height: 1.4; }
    .node-tag { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .metric-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }
    
    /* Animation effects */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.04); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pingDot {
      0% { r: 3; opacity: 1; }
      100% { r: 12; opacity: 0; }
    }

    .flow-line { stroke: url(#lineGrad); stroke-width: 2.5; stroke-dasharray: 6 6; animation: dashFlow 2s linear infinite; }
    .flow-line-cyan { stroke: #06B6D4; stroke-width: 2; stroke-dasharray: 5 5; animation: dashFlow 1.8s linear infinite; }
    .flow-line-gold { stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 5 5; animation: dashFlow 2.2s linear infinite; }
    .flow-line-emerald { stroke: #10B981; stroke-width: 2; stroke-dasharray: 5 5; animation: dashFlow 1.5s linear infinite; }

    .glow-circle { animation: pulseGlow 3s ease-in-out infinite; transform-origin: center; }
    .card-hover { transition: transform 0.3s ease; }
    .ping-circle { animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Subtle Matrix / Grid Background -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#gridPattern)"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="-10" y="-8" width="48" height="48" rx="12" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <path d="M4 22 L14 12 L24 22 M8 18 L8 28 L20 28 L20 18" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="54" y="16" class="title-text">End-to-End Machine Learning Pipeline Architecture</text>
    <text x="54" y="36" class="subtitle-text">House Price Econometric Modeling • Ordinary Least Squares • Ridge • Lasso • Live Appraisal Engine</text>
  </g>

  <!-- Real-Time Status Pill -->
  <g transform="translate(1000, 44)">
    <rect width="140" height="34" rx="17" fill="#1E293B" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4.5" fill="#10B981"/>
    <circle cx="20" cy="17" r="4.5" fill="#10B981" class="ping-circle"/>
    <text x="34" y="21.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981">PIPELINE: LIVE</text>
  </g>

  <!-- ================= PIPELINE FLOW CONNECTOR LINES ================= -->
  <g fill="none">
    <!-- Top Row Horizontal: Node 1 -> Node 2 -> Node 3 -->
    <path d="M 280 190 L 330 190" class="flow-line-cyan"/>
    <path d="M 570 190 L 620 190" class="flow-line-cyan"/>
    
    <!-- Top Right Down to Middle Right: Node 3 -> Node 4 -->
    <path d="M 860 190 Q 940 190 940 260 L 940 300 Q 940 370 860 370" class="flow-line-gold"/>

    <!-- Middle Row Horizontal (Right to Left): Node 4 -> Node 5 -> Node 6 -->
    <path d="M 620 370 L 570 370" class="flow-line-gold"/>
    <path d="M 330 370 L 280 370" class="flow-line-gold"/>

    <!-- Middle Left Down to Bottom Left: Node 6 -> Node 7 -->
    <path d="M 170 445 L 170 495 Q 170 540 250 540" class="flow-line-emerald"/>
    
    <!-- Bottom Row Horizontal: Node 7 -> Node 8 -->
    <path d="M 630 550 L 700 550" class="flow-line-emerald"/>
  </g>

  <!-- ================= PIPELINE NODES ================= -->

  <!-- NODE 1: Data Ingestion -->
  <g transform="translate(60, 115)" filter="url(#cardShadow)">
    <rect width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="url(#accentCyan)"/>
    <g transform="translate(18, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#38BDF8">01</text>
      <text x="32" y="8" class="node-tag" fill="#38BDF8">DATA INGESTION</text>
      <text x="32" y="24" class="node-title">Raw Housing Data</text>
      
      <text x="0" y="52" class="node-desc">• 300 Validated Samples</text>
      <text x="0" y="70" class="node-desc">• 8 Structural Features</text>
      <text x="0" y="88" class="node-desc">• Target: SalePrice ($)</text>
    </g>
  </g>

  <!-- NODE 2: EDA & Data Sanitation -->
  <g transform="translate(350, 115)" filter="url(#cardShadow)">
    <rect width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="url(#accentCyan)"/>
    <g transform="translate(18, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#38BDF8">02</text>
      <text x="32" y="8" class="node-tag" fill="#38BDF8">EDA &amp; SANITATION</text>
      <text x="32" y="24" class="node-title">Data Profiling</text>
      
      <text x="0" y="52" class="node-desc">• 0 Missing Values / Nulls</text>
      <text x="0" y="70" class="node-desc">• 0 Duplicate Records</text>
      <text x="0" y="88" class="node-desc">• Full Numeric Verification</text>
    </g>
  </g>

  <!-- NODE 3: Statistical Correlation -->
  <g transform="translate(640, 115)" filter="url(#cardShadow)">
    <rect width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="url(#accentCopper)"/>
    <g transform="translate(18, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#F59E0B">03</text>
      <text x="32" y="8" class="node-tag" fill="#F59E0B">FEATURE RANKING</text>
      <text x="32" y="24" class="node-title">Correlation Matrix</text>
      
      <text x="0" y="52" class="node-desc">• GrLivArea: r = +0.75 (Top)</text>
      <text x="0" y="70" class="node-desc">• OverallQual: r = +0.35</text>
      <text x="0" y="88" class="node-desc">• GarageCars: r = +0.35</text>
    </g>
  </g>

  <!-- NODE 4: Train/Test Split -->
  <g transform="translate(640, 295)" filter="url(#cardShadow)">
    <rect width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="url(#accentCopper)"/>
    <g transform="translate(18, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#F59E0B">04</text>
      <text x="32" y="8" class="node-tag" fill="#F59E0B">PARTITIONING</text>
      <text x="32" y="24" class="node-title">80 / 20 Data Split</text>
      
      <text x="0" y="52" class="node-desc">• Train Set: 240 Properties</text>
      <text x="0" y="70" class="node-desc">• Test Set: 60 Properties</text>
      <text x="0" y="88" class="node-desc">• Seeded Reproducibility</text>
    </g>
  </g>

  <!-- NODE 5: Model Training Core -->
  <g transform="translate(350, 295)" filter="url(#cardShadow)">
    <rect width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="url(#accentPurple)"/>
    <g transform="translate(18, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#A78BFA">05</text>
      <text x="32" y="8" class="node-tag" fill="#A78BFA">MODEL TRAINING</text>
      <text x="32" y="24" class="node-title">Regression Suite</text>
      
      <text x="0" y="52" class="node-desc">• OLS Multiple Linear Reg.</text>
      <text x="0" y="70" class="node-desc">• Ridge L2 Regularization</text>
      <text x="0" y="88" class="node-desc">• Lasso L1 Feature Sparsity</text>
    </g>
  </g>

  <!-- NODE 6: Econometric Coefficients -->
  <g transform="translate(60, 295)" filter="url(#cardShadow)">
    <rect width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="url(#accentPurple)"/>
    <g transform="translate(18, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#A78BFA">06</text>
      <text x="32" y="8" class="node-tag" fill="#A78BFA">INTERPRETABILITY</text>
      <text x="32" y="24" class="node-title">Weights &amp; Slopes</text>
      
      <text x="0" y="52" class="node-desc">• Garage: +$19,110 / car</text>
      <text x="0" y="70" class="node-desc">• Quality: +$11,915 / pt</text>
      <text x="0" y="88" class="node-desc">• SqFt: +$55.41 / sqft</text>
    </g>
  </g>

  <!-- NODE 7: Evaluation & Diagnostics (Wide Box) -->
  <g transform="translate(250, 475)" filter="url(#cardShadow)">
    <rect width="380" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="4" rx="2" fill="url(#accentEmerald)"/>
    <g transform="translate(20, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#10B981">07</text>
      <text x="32" y="8" class="node-tag" fill="#10B981">VALIDATION &amp; ACCURACY</text>
      <text x="32" y="24" class="node-title">Performance Metrics &amp; Diagnostics</text>
      
      <g transform="translate(0, 44)">
        <!-- Metric 1 -->
        <rect width="105" height="52" rx="8" fill="#141E2E" stroke="rgba(16, 185, 129, 0.2)"/>
        <text x="10" y="18" font-size="9" fill="#94A3B8">R² SCORE</text>
        <text x="10" y="40" class="metric-value" fill="#10B981">0.9724</text>
        
        <!-- Metric 2 -->
        <g transform="translate(115, 0)">
          <rect width="105" height="52" rx="8" fill="#141E2E" stroke="rgba(56, 189, 248, 0.2)"/>
          <text x="10" y="18" font-size="9" fill="#94A3B8">RMSE</text>
          <text x="10" y="40" class="metric-value" fill="#38BDF8">$12.50K</text>
        </g>
        
        <!-- Metric 3 -->
        <g transform="translate(230, 0)">
          <rect width="105" height="52" rx="8" fill="#141E2E" stroke="rgba(245, 158, 11, 0.2)"/>
          <text x="10" y="18" font-size="9" fill="#94A3B8">TYPICAL ERR</text>
          <text x="10" y="40" class="metric-value" fill="#F59E0B">4.96%</text>
        </g>
      </g>
    </g>
  </g>

  <!-- NODE 8: Interactive Appraisal Engine (Wide Box) -->
  <g transform="translate(700, 475)" filter="url(#cardShadow)">
    <rect width="440" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="4" rx="2" fill="url(#accentCopper)"/>
    <g transform="translate(22, 26)">
      <circle cx="10" cy="10" r="14" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="6" y="14" font-size="12" fill="#F59E0B">08</text>
      <text x="32" y="8" class="node-tag" fill="#F59E0B">PRODUCTION INTERFACE</text>
      <text x="32" y="24" class="node-title">The Appraisal Desk (Web Dashboard)</text>
      
      <text x="0" y="52" class="node-desc">• Real-Time Valuation Calculator &amp; Sliders</text>
      <text x="0" y="70" class="node-desc">• Dynamic Chart.js Visualizations &amp; Residual Plots</text>
      <text x="0" y="88" class="node-desc">• Instant Single-File Zero-Dependency Standalone GUI</text>
    </g>
  </g>

</svg>
