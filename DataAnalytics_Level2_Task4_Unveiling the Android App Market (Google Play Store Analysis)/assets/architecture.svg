<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="520">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E11"/>
      <stop offset="100%" stop-color="#121A1E"/>
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192429"/>
      <stop offset="100%" stop-color="#121A1E"/>
    </linearGradient>

    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5FBF8E"/>
      <stop offset="100%" stop-color="#48A9B5"/>
    </linearGradient>

    <linearGradient id="flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48A9B5"/>
      <stop offset="100%" stop-color="#E0A54A"/>
    </linearGradient>

    <linearGradient id="flow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0A54A"/>
      <stop offset="100%" stop-color="#D9705E"/>
    </linearGradient>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes dashMove {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(95,191,142,0.4)); }
      }
      @keyframes floatDot {
        0% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-4px); opacity: 1; }
        100% { transform: translateY(0); opacity: 0.4; }
      }
      .anim-stream { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
      .anim-pulse { animation: pulseNode 4s infinite ease-in-out; }
      .anim-dot { animation: floatDot 3s infinite ease-in-out; }
      .heading { font-family: 'Archivo', 'Segoe UI', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; }
      .body-font { font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #A3B3AE; }
      .code-font { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; fill: #5FBF8E; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="14" fill="url(#bgArch)"/>
  <rect width="100%" height="100%" rx="14" fill="none" stroke="#26333A" stroke-width="1.2"/>

  <!-- Top Title Header -->
  <g transform="translate(48, 42)">
    <text x="0" y="0" fill="#E8EFEC" font-size="20" class="heading">END-TO-END DATA ARCHITECTURE &amp; PIPELINE WORKFLOW</text>
    <text x="0" y="22" fill="#6E817C" font-size="13.5" class="body-font">From raw tabular records and unstructured user reviews to high-performance client-side analytics</text>
  </g>

  <!-- Animated Data Streams (Connector Lines) -->
  <!-- Layer 1 to Layer 2 -->
  <path d="M 230,195 L 310,195" fill="none" stroke="#5FBF8E" stroke-width="2.5" class="anim-stream"/>
  <path d="M 230,355 L 310,355" fill="none" stroke="#5FBF8E" stroke-width="2.5" class="anim-stream"/>

  <!-- Layer 2 to Layer 3 -->
  <path d="M 520,230 L 590,230" fill="none" stroke="#48A9B5" stroke-width="2.5" class="anim-stream"/>
  <path d="M 520,320 L 590,320" fill="none" stroke="#48A9B5" stroke-width="2.5" class="anim-stream"/>

  <!-- Layer 3 to Layer 4 -->
  <path d="M 800,275 L 870,275" fill="none" stroke="#E0A54A" stroke-width="2.5" class="anim-stream"/>

  <!-- PIPELINE STAGE 1: INGESTION -->
  <g transform="translate(48, 110)">
    <rect width="182" height="350" rx="10" fill="url(#nodeGrad1)" stroke="#26333A" stroke-width="1.2"/>
    <!-- Stage Header -->
    <rect width="182" height="34" rx="10" fill="#1B2429"/>
    <text x="16" y="22" fill="#5FBF8E" class="code-font">01 · INGESTION</text>
    
    <!-- Item 1: Apps Dataset -->
    <g transform="translate(14, 50)">
      <rect width="154" height="120" rx="8" fill="#141E22" stroke="#26333A" stroke-width="1"/>
      <text x="14" y="24" fill="#E8EFEC" font-size="13.5" class="heading">Apps Dataset</text>
      <text x="14" y="42" fill="#6E817C" class="code-font">googleplaystore.csv</text>
      <text x="14" y="68" class="body-font">• 10,841 raw rows</text>
      <text x="14" y="86" class="body-font">• 13 schema fields</text>
      <text x="14" y="104" class="body-font">• Price, Rating, Size</text>
    </g>

    <!-- Item 2: Reviews Dataset -->
    <g transform="translate(14, 190)">
      <rect width="154" height="135" rx="8" fill="#141E22" stroke="#26333A" stroke-width="1"/>
      <text x="14" y="24" fill="#E8EFEC" font-size="13.5" class="heading">Reviews Dataset</text>
      <text x="14" y="42" fill="#6E817C" class="code-font">user_reviews.csv</text>
      <text x="14" y="68" class="body-font">• 64,295 review text</text>
      <text x="14" y="86" class="body-font">• 1,074 paired apps</text>
      <text x="14" y="104" class="body-font">• Raw feedback corpus</text>
      <text x="14" y="122" class="body-font">• Sentiment baseline</text>
    </g>
  </g>

  <!-- PIPELINE STAGE 2: PREPROCESSING -->
  <g transform="translate(310, 110)">
    <rect width="210" height="350" rx="10" fill="url(#nodeGrad1)" stroke="#26333A" stroke-width="1.2"/>
    <rect width="210" height="34" rx="10" fill="#1B2429"/>
    <text x="16" y="22" fill="#48A9B5" class="code-font">02 · PREPROCESSING</text>

    <!-- Pipeline Tasks -->
    <g transform="translate(14, 50)">
      <!-- Task 1 -->
      <rect width="182" height="64" rx="7" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Corrupted Row Pruning</text>
      <text x="14" y="40" class="body-font">Row #10472 shifted category</text>
      <text x="14" y="55" class="code-font">drop_row_by_index(10472)</text>
    </g>
    
    <g transform="translate(14, 124)">
      <!-- Task 2 -->
      <rect width="182" height="64" rx="7" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Deduplication Logic</text>
      <text x="14" y="40" class="body-font">Unique App names retained</text>
      <text x="14" y="55" class="code-font">10,841 → 9,659 records</text>
    </g>

    <g transform="translate(14, 198)">
      <!-- Task 3 -->
      <rect width="182" height="64" rx="7" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Type Sanitisation</text>
      <text x="14" y="40" class="body-font">Stripped '+', '$', 'M', 'k'</text>
      <text x="14" y="55" class="code-font">float32 &amp; log1p scaling</text>
    </g>

    <g transform="translate(14, 272)">
      <!-- Task 4 -->
      <rect width="182" height="64" rx="7" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">NLP Cleaning (TextBlob)</text>
      <text x="14" y="40" class="body-font">Null review filtering</text>
      <text x="14" y="55" class="code-font">37,427 polarized reviews</text>
    </g>
  </g>

  <!-- PIPELINE STAGE 3: ANALYTICS & ML -->
  <g transform="translate(590, 110)">
    <rect width="210" height="350" rx="10" fill="url(#nodeGrad1)" stroke="#26333A" stroke-width="1.2"/>
    <rect width="210" height="34" rx="10" fill="#1B2429"/>
    <text x="16" y="22" fill="#E0A54A" class="code-font">03 · ANALYTICS &amp; ML</text>

    <!-- Module 1 -->
    <g transform="translate(14, 50)">
      <rect width="182" height="85" rx="7" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Market EDA &amp; NLP</text>
      <text x="14" y="40" class="body-font">• Category density &amp; reach</text>
      <text x="14" y="58" class="body-font">• Stars vs Polarity gap</text>
      <text x="14" y="74" class="code-font">TextBlob Polarity [-1 to +1]</text>
    </g>

    <!-- Module 2 -->
    <g transform="translate(14, 145)">
      <rect width="182" height="85" rx="7" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Feature Screening</text>
      <text x="14" y="40" class="body-font">• Permutation importance</text>
      <text x="14" y="58" class="body-font">• 12 → 6 impactful features</text>
      <text x="14" y="74" class="code-font">scikit-learn 15 repeats</text>
    </g>

    <!-- Module 3 -->
    <g transform="translate(14, 240)">
      <rect width="182" height="96" rx="7" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Gradient Boosting Engine</text>
      <text x="14" y="40" class="body-font">• 5-Fold Cross Validation</text>
      <text x="14" y="58" class="body-font">• R² = 0.153 | MAE = 0.354★</text>
      <text x="14" y="76" class="body-font">• Exported model weights</text>
      <text x="14" y="90" class="code-font">Runs live in browser!</text>
    </g>
  </g>

  <!-- PIPELINE STAGE 4: INTERACTIVE INTERFACE -->
  <g transform="translate(870, 110)">
    <rect width="182" height="350" rx="10" fill="url(#nodeGrad1)" stroke="#26333A" stroke-width="1.2" class="anim-pulse"/>
    <rect width="182" height="34" rx="10" fill="#1B2429"/>
    <text x="16" y="22" fill="#D9705E" class="code-font">04 · PRESENTATION</text>

    <g transform="translate(14, 50)">
      <rect width="154" height="68" rx="8" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Single-Page UI</text>
      <text x="14" y="40" class="body-font">Seamless flow &amp; auto-scroll</text>
      <text x="14" y="56" class="code-font">Zero page reloads</text>
    </g>

    <g transform="translate(14, 128)">
      <rect width="154" height="68" rx="8" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Dynamic ScrollSpy</text>
      <text x="14" y="40" class="body-font">Sticky sidebar tracks active</text>
      <text x="14" y="56" class="code-font">IntersectionObserver</text>
    </g>

    <g transform="translate(14, 206)">
      <rect width="154" height="68" rx="8" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Custom SVG &amp; Canvas</text>
      <text x="14" y="40" class="body-font">Scatter map + 16 charts</text>
      <text x="14" y="56" class="code-font">No heavy dependencies</text>
    </g>

    <g transform="translate(14, 284)">
      <rect width="154" height="52" rx="8" fill="#141E22" stroke="#26333A"/>
      <text x="14" y="22" fill="#E8EFEC" font-size="13" class="heading">Live Predictor</text>
      <text x="14" y="40" class="body-font">Interactive sliders</text>
    </g>
  </g>
</svg>
